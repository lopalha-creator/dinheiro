<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dinheiro">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
<title>Dinheiro</title>
<style>
/* Manrope (licença SIL OFL, ver fonts/OFL.txt), guardada com a app para funcionar sem internet. */
@font-face { font-family: 'Manrope'; src: url(fonts/manrope.woff2) format('woff2'); font-weight: 400 800; font-display: swap; }

/* Estilo de app de banco moderna (como a do Revolut): topo com gradiente e o saldo em grande,
   botões de ação redondos, cartões muito arredondados sem linhas a separar e avatares com iniciais. */
:root {
  --bg: #f3f4f8; --cel: #fff; --txt: #191c1f; --sec: #6f7380; --ter: #b4b7c1;
  --sep: rgba(25,28,31,.08); --fill: rgba(25,28,31,.06); --prem: rgba(25,28,31,.05);
  --acc: #2d5bff; --acc-forte: #2d5bff; --acc-suave: rgba(45,91,255,.18); --verde: #148043; --verm: #d1323c; --verm-suave: rgba(209,50,60,.12);
  --barra: rgba(255,255,255,.86); --acoes: rgba(255,255,255,.96); --seg-on: #fff; --toast: rgba(25,28,31,.94);
  --sombra: 0 1px 2px rgba(25,28,31,.04), 0 6px 20px rgba(25,28,31,.05);
  /* gradiente do topo */
  --h1: #3d63ff; --h2: #7b4dff; --h3: #ff6fae; --h0: #2f45d8;
  /* cores da barra de distribuição e dos avatares, por esta ordem (validadas para daltonismo); --tN é o texto por cima de --cN */
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948; --c0: #8e8e93;
  --t1: #fff; --t2: #191c1f; --t3: #191c1f; --t4: #191c1f; --t5: #191c1f; --t6: #fff; --t7: #fff; --t8: #191c1f; --t0: #191c1f;
  --fonte: Manrope, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000; --cel: #16171b; --txt: #fff; --sec: #8b8e99; --ter: #4a4d57;
    --sep: rgba(255,255,255,.08); --fill: rgba(255,255,255,.08); --prem: rgba(255,255,255,.06);
    --acc: #6b8aff; --acc-forte: #4b6bff; --acc-suave: rgba(107,138,255,.22); --verde: #3ddc84; --verm: #ff6369; --verm-suave: rgba(255,99,105,.16);
    --barra: rgba(18,19,22,.86); --acoes: rgba(32,33,38,.96); --seg-on: #34363d; --toast: rgba(44,46,52,.96);
    --sombra: none;
    --h1: #2442e0; --h2: #5a2fd6; --h3: #b2367a; --h0: #121a6b;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --c0: #636366;
    --t1: #191c1f; --t2: #191c1f; --t3: #191c1f; --t4: #191c1f; --t5: #191c1f; --t6: #fff; --t7: #191c1f; --t8: #191c1f; --t0: #fff;
  }
}
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
html.travado { overflow: hidden; }
body {
  background: var(--bg); color: var(--txt);
  font: 500 16px/1.35 var(--fonte); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; min-height: 100vh;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
input, textarea { font: inherit; color: inherit; background: none; border: 0; outline: 0; width: 100%; min-width: 0; }
input::placeholder, textarea::placeholder { color: var(--ter); }
svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

.pagina { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 4px) 16px calc(100px + env(safe-area-inset-bottom)); }
.barra { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 52px; }
.acoes { display: flex; gap: 8px; align-items: center; }
.icbtn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--cel); color: var(--txt); box-shadow: var(--sombra); }
.icbtn svg { width: 22px; height: 22px; stroke-width: 2; }
.icbtn.peq { width: 32px; height: 32px; background: var(--fill); color: var(--sec); box-shadow: none; }
.icbtn.peq svg { width: 18px; height: 18px; }
.txtbtn { height: 40px; padding: 0 16px; border-radius: 999px; background: var(--cel); color: var(--acc); font-size: 15px; font-weight: 700; box-shadow: var(--sombra); }
.marca { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
h1 { font-size: 32px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; margin: 4px 0 6px; overflow-wrap: anywhere; text-wrap: balance; }

/* topo com gradiente */
.heroi {
  color: #fff; margin: calc(-4px - env(safe-area-inset-top)) -16px 18px; padding: calc(env(safe-area-inset-top) + 4px) 16px 24px;
  border-radius: 0 0 32px 32px;
  background:
    radial-gradient(110% 80% at 0% 0%, var(--h1), transparent 62%),
    radial-gradient(90% 75% at 100% 0%, var(--h2), transparent 66%),
    radial-gradient(80% 70% at 75% 100%, var(--h3), transparent 70%),
    var(--h0);
}
.heroi .icbtn, .heroi .pilula, .heroi .acao-red .circ { background: rgba(255,255,255,.2); color: #fff; box-shadow: none; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.heroi-centro { text-align: center; padding: 16px 0 2px; }
.heroi-rot { font-size: 14px; font-weight: 700; opacity: .85; }
.valor-g { font-size: 44px; font-weight: 800; letter-spacing: -.035em; line-height: 1.1; margin: 4px 0 12px; overflow-wrap: anywhere; }
.valor-g small, .valor-m small { font-size: .56em; font-weight: 800; letter-spacing: -.01em; }
.pilula { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 700; }

/* botões de ação redondos */
.botoes-acao { display: flex; justify-content: center; gap: 4px; margin-top: 22px; }
.acao-red { flex: 0 1 84px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; text-align: center; line-height: 1.2; }
.acao-red .circ { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--cel); color: var(--acc); box-shadow: var(--sombra); transition: transform .15s; }
.acao-red .circ svg { width: 22px; height: 22px; stroke-width: 2.1; }
.acao-red:active .circ { transform: scale(.92); }

/* cartões e linhas */
.cartao { background: var(--cel); border-radius: 24px; padding: 6px 0; margin-bottom: 16px; box-shadow: var(--sombra); overflow: hidden; }
.cartao > * { position: relative; }
.cartao-cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 48px; padding: 10px 16px 4px; }
.cartao-cab h2 { font-size: 18px; font-weight: 800; letter-spacing: -.02em; overflow-wrap: anywhere; }
.cartao-cab .dir { display: flex; align-items: center; gap: 8px; color: var(--sec); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lig { color: var(--acc); font-size: 15px; font-weight: 700; padding: 6px 0; }
.linha { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 10px 16px; }
button.linha:active, .grupo-acoes button:active, .cancelar-acoes:active { background: var(--prem); }
.txt { flex: 1; min-width: 0; }
.tit { font-weight: 700; overflow-wrap: anywhere; }
.sub { font-size: 13px; color: var(--sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.val { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sec { color: var(--sec); }
.ter { color: var(--ter); }
.pos { color: var(--verde); }
.neg { color: var(--verm); }
.zero { color: var(--sec); }
.acao { color: var(--acc); font-weight: 700; }
.perigo { color: var(--verm) !important; }
.avatar { width: 42px; height: 42px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--txt); font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
.avatar svg { width: 20px; height: 20px; stroke-width: 2.1; }
.avatar.grande { width: 76px; height: 76px; font-size: 28px; }
.acao .avatar { background: var(--acc-suave); color: var(--acc); }
.perigo .avatar { background: var(--verm-suave); color: var(--verm); }
.cab-valor { padding: 0 2px 16px; }
.cab-valor .valor-g { margin: 2px 0 0; }
.rot { font-size: 14px; font-weight: 700; color: var(--sec); }
.leg { font-size: 14px; font-weight: 600; color: var(--sec); }
.perfil { text-align: center; padding: 2px 0 20px; }
.perfil .avatar { margin: 0 auto 12px; }
.perfil h1 { font-size: 22px; margin: 0; }
.perfil .valor-g { margin: 6px 0 2px; }
.texto { font-size: 14px; color: var(--sec); padding: 0 16px 12px; overflow-wrap: anywhere; }
.texto b { color: var(--txt); }
.botoes-linha { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 16px 12px; }
.btn-pri, .btn-sec { text-align: center; font-size: 15px; font-weight: 800; padding: 13px 20px; border-radius: 999px; }
.btn-pri { background: var(--acc-forte); color: #fff; }
.btn-sec { background: var(--fill); color: var(--txt); }
.btn-pri.largo { display: block; width: 100%; padding: 16px; margin: 4px 0 16px; font-size: 16px; }
.rodape { font-size: 13px; color: var(--sec); padding: 0 16px; margin: -6px 0 18px; }
.mini { width: 40px; height: 34px; border-radius: 12px; background: var(--fill); color: var(--acc); text-align: center; font-size: 17px; font-weight: 700; }
.mini:disabled { opacity: .3; }
textarea.nota { display: block; padding: 4px 16px 14px; resize: none; min-height: 46px; }
.passos { padding: 0 16px 12px 38px; font-size: 15px; }
.passos li { margin: 0 0 10px; padding-left: 2px; }
.passos li::marker { font-weight: 800; color: var(--acc); }
code { font: 700 14px/1.3 ui-monospace, Menlo, monospace; background: var(--fill); padding: 2px 6px; border-radius: 6px; overflow-wrap: anywhere; }

/* gráficos */
.leitura { padding: 0 16px; }
.valor-m { font-size: 24px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 2px; }
.chips button { padding: 6px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--sec); }
.chips .on { background: var(--txt); color: var(--cel); }
.graf { position: relative; margin: 12px 16px 10px; touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; outline: 0; border-radius: 8px; }
.graf:focus-visible { box-shadow: 0 0 0 2px var(--acc); }
.graf svg { display: block; overflow: visible; stroke: none; }
.graf text { fill: var(--sec); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.graf .grelha { stroke: var(--sep); stroke-width: 1; }
.graf .eixo0 { stroke: var(--ter); stroke-width: 1; }
.graf .traco { fill: none; stroke: var(--acc); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.graf .marca { fill: var(--acc); stroke: var(--cel); stroke-width: 2; }
.graf .mira, .graf .cursor { visibility: hidden; }
.graf .mira { stroke: var(--sec); stroke-width: 1; }
.graf.ativo .mira, .graf.ativo .cursor { visibility: visible; }
.graf .coluna { fill: var(--acc-suave); transition: fill .15s; }
.graf .coluna.on { fill: var(--acc); }
.comp-bloco { padding: 8px 16px 6px; }
.comp { display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: hidden; }
.comp span { min-width: 3px; }

/* ocultar valores (para mostrar o ecrã a alguém) */
.oculto :is(.val, .valor-g, .valor-m, .leg, .sub, .pilula, .graf text, .cartao-cab .dir) { filter: blur(8px); }

/* barra de separadores */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center;
  padding: 8px 8px calc(env(safe-area-inset-bottom) + 6px);
  background: var(--barra); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--sep);
}
.tabs button { flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--sec); padding: 2px 0; }
.tabs svg { width: 24px; height: 24px; stroke-width: 2; }
.tabs .on { color: var(--txt); }

.entra { animation: entra .3s cubic-bezier(.2,.8,.2,1); }
.volta { animation: volta .3s cubic-bezier(.2,.8,.2,1); }
@keyframes entra { from { transform: translateX(28%); opacity: 0; } }
@keyframes volta { from { transform: translateX(-18%); opacity: 0; } }

/* folhas e menus */
#camada .fundo { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.4); animation: aparece .25s; }
.folha {
  position: fixed; left: 0; right: 0; bottom: 0; top: calc(env(safe-area-inset-top) + 10px); z-index: 11;
  max-width: 640px; margin: 0 auto; background: var(--bg); border-radius: 28px 28px 0 0;
  display: flex; flex-direction: column; animation: sobe .34s cubic-bezier(.2,.8,.2,1);
}
.folha::before { content: ""; position: absolute; top: 7px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: var(--ter); }
.folha-barra { padding: 20px 16px 0; }
.folha-corpo { flex: 1; overflow: auto; padding: 8px 16px 40px; }
.folha-tit { font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; margin-bottom: 18px; overflow-wrap: anywhere; }
.folha .cartao { padding: 4px 0; }
.folha .linha { min-height: 56px; }
.campo-val { min-height: 76px !important; }
.campo-val span { color: var(--sec); font-size: 30px; font-weight: 800; }
.valor-grande { font-size: 36px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
input[type=date] { width: auto; text-align: right; color: var(--acc); font-weight: 700; }
.seg { display: flex; background: var(--fill); border-radius: 999px; padding: 3px; margin-bottom: 14px; }
.seg button { flex: 1; text-align: center; padding: 10px 4px; border-radius: 999px; font-size: 15px; font-weight: 700; color: var(--sec); }
.seg .on { background: var(--seg-on); color: var(--txt); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.interruptor { appearance: none; -webkit-appearance: none; flex: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill); position: relative; transition: background .2s; }
.interruptor::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.22); transition: transform .2s; }
.interruptor:checked { background: var(--acc-forte); }
.interruptor:checked::after { transform: translateX(20px); }

.folha-acoes {
  position: fixed; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 8px); z-index: 11; max-width: 480px; margin: 0 auto;
  display: flex; flex-direction: column; max-height: calc(100% - env(safe-area-inset-top) - 24px); animation: sobe .3s cubic-bezier(.2,.8,.2,1);
}
.grupo-acoes { background: var(--acoes); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 22px; overflow: auto; margin-bottom: 8px; }
.grupo-acoes > * + * { border-top: .5px solid var(--sep); }
.grupo-acoes button, .cancelar-acoes { display: block; width: 100%; text-align: center; padding: 17px; font-size: 17px; font-weight: 700; color: var(--acc); }
.titulo-acoes { font-size: 13px; font-weight: 600; color: var(--sec); text-align: center; padding: 14px 16px; }
.cancelar-acoes { flex: none; background: var(--cel); color: var(--txt); border-radius: 22px; }
#camada.saindo .folha, #camada.saindo .folha-acoes { animation: desce .25s forwards; }
#camada.saindo .fundo { animation: some .25s forwards; }
@keyframes sobe { from { transform: translateY(100%); } }
@keyframes desce { to { transform: translateY(110%); } }
@keyframes aparece { from { opacity: 0; } }
@keyframes some { to { opacity: 0; } }
.abanar { animation: abanar .3s; }
@keyframes abanar { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

#toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 20;
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: .25s;
  background: var(--toast); color: #fff; padding: 12px 20px; border-radius: 22px; font-size: 15px; font-weight: 700;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toast { width: max-content; max-width: calc(100vw - 32px); text-align: center; }
#toast.com-acao { pointer-events: auto; display: flex; align-items: center; gap: 14px; text-align: left; }
#toast button { flex: none; color: #9db0ff; font-weight: 800; padding: 4px 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="camada"></div>
<div id="toast" role="status"></div>
<script>
'use strict';

/* ---------- utilitários ---------- */
const CHAVE = 'dinheiro.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const hoje = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const MESES_LONGOS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
/** "2026-10-08" → "8 out 2026" */
const dataPT = iso => { const [a, m, d] = iso.split('-'); return `${+d} ${MESES[m - 1]} ${a}`; };

// Todos os valores são guardados em cêntimos (inteiros) para não haver erros de arredondamento.
const fmtEuro = new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' });
const euro = c => fmtEuro.format(c / 100);
const euroSinal = c => c > 0 ? '+' + euro(c) : c < 0 ? '−' + euro(-c) : euro(0);
const numero = c => {
  const a = Math.abs(c);
  return (a / 100).toLocaleString('pt-PT', { minimumFractionDigits: a % 100 ? 2 : 0, maximumFractionDigits: 2, useGrouping: false });
};
const numSinal = c => (c < 0 ? '-' : '') + numero(c);
const cor = c => c > 0 ? 'pos' : c < 0 ? 'neg' : 'zero';

/** Lê "15,32", "1.044,50", "1.200", "2 543,49 €" ou somas como "115,82 + 4,60 - 60". Devolve cêntimos ou null. */
function lerValor(texto) {
  // um ponto ou vírgula sem algarismo a seguir (fim de frase, "aprox.") não é separador
  const s = String(texto).replace(/−/g, '-').replace(/[^0-9,.+\-]/g, '').replace(/[.,](?!\d)/g, '');
  if (!s) return null;
  const termos = [];
  let atual = '';
  for (const ch of s) {
    if ((ch === '+' || ch === '-') && atual && atual !== '+' && atual !== '-') { termos.push(atual); atual = ch; }
    else atual += ch;
  }
  termos.push(atual);
  let total = 0;
  for (let t of termos) {
    // "1.044,50" e "1,200.5": o último separador é o das décimas. "1.200" (pontos de 3 em 3 algarismos) são milhares.
    if (t.includes(',') && t.includes('.')) t = t.lastIndexOf(',') > t.lastIndexOf('.') ? t.replace(/\./g, '') : t.replace(/,/g, '');
    else if (/^[+-]?[1-9]\d{0,2}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
    t = t.replace(/,/g, '.');
    if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(t)) return null;
    total += Math.round(parseFloat(t) * 100);
  }
  return total;
}

/* ---------- dados ---------- */
// Começa vazia. Os dados pessoais entram por "Colar os meus dados" ou por ficheiro, e ficam só no iPhone.
function dadosIniciais() {
  return {
    versao: 2,
    contas: [],
    grupos: [
      { id: uid(), nome: 'Pais', tipo: 'dividas', fichas: [] },
      { id: uid(), nome: 'Amigos', tipo: 'dividas', fichas: [] },
      { id: uid(), nome: 'Viagens', tipo: 'gastos', fichas: [] },
    ],
  };
}

function carregar() {
  try { const s = localStorage.getItem(CHAVE); if (s) return JSON.parse(s); } catch {}

}

/** Cada conta tem um histórico de valores [{ data, valor }] por ordem de data; o valor atual é o último. */
function ordenarHist(c) {
  c.hist.sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0);
  c.valor = c.hist[c.hist.length - 1].valor;
}
/** Acrescenta a dados antigos o que as versões novas precisam (o histórico das contas começa hoje). */
function migrar(d) {
  for (const c of d.contas) {
    if (!Array.isArray(c.hist) || !c.hist.length) c.hist = [{ data: hoje(), valor: c.valor }];
    ordenarHist(c);
  }
  d.versao = 2;
  return d;
}

db = db ? migrar(db) : dadosIniciais();

const totalFicha = f => f.movimentos.reduce((s, m) => s + m.valor, 0);
const totalGrupo = g => g.fichas.reduce((s, f) => s + totalFicha(f), 0);
const gruposDe = tipo => db.grupos.filter(g => g.tipo === tipo);

const movOrdenados = f => f.movimentos
  .map((m, i) => [m, i])
  .sort((a, b) => a[0].data < b[0].data ? -1 : a[0].data > b[0].data ? 1 : a[1] - b[1])
  .map(x => x[0]);
/** A conta escrita como na nota: "115,82 tricount + 4,60 pré casa − 2,50 fino ibar" */
const expressao = f => movOrdenados(f)
  .map((m, i) => (m.valor < 0 ? '− ' : i ? '+ ' : '') + numero(m.valor) + (m.desc ? ' ' + m.desc : ''))
  .join(' ');
function acharFicha(id) {
  for (const g of db.grupos) { const f = g.fichas.find(f => f.id === id); if (f) return [g, f]; }
  return [null, null];
}
function mover(lista, id, d) {
  const i = lista.findIndex(x => x.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= lista.length) return;
  [lista[i], lista[j]] = [lista[j], lista[i]];
}

/* ---------- estado do ecrã ---------- */
const lerPref = (k, def) => { try { return localStorage.getItem('dinheiro.' + k) ?? def; } catch { return def; } };
const gravarPref = (k, v) => { try { localStorage.setItem('dinheiro.' + k, v); } catch {} };
const ui = {
  tab: lerPref('tab', 'resumo'),
  ficha: { contas: null, dividas: null, gastos: null }, // conta ou ficha aberta em cada separador
  scroll: {},
  ordenar: false,
  anim: '',
  periodo: lerPref('periodo', 'Tudo'),
  oculto: lerPref('oculto', '') === '1',
};
let camada = null; // folha ou menu aberto

/* ---------- séries no tempo ---------- */
// Nos gráficos os dias são inteiros (dias desde 1970), para as contas com datas serem simples.
const DIA = 864e5;
const diaDe = iso => Math.round(Date.parse(iso + 'T00:00Z') / DIA);
const isoDe = n => new Date(n * DIA).toISOString().slice(0, 10);
const PERIODOS = [['1M', 'no último mês', 30], ['3M', 'nos últimos 3 meses', 91], ['1A', 'no último ano', 365], ['Tudo', '', Infinity]];
const fmtCompacto = new Intl.NumberFormat('pt-PT', { notation: 'compact', maximumFractionDigits: 1 });
const fmtPct = new Intl.NumberFormat('pt-PT', { style: 'percent', maximumFractionDigits: 1 });

/** Junta variações [dia, delta] numa série em escada [dia, valor], com um ponto por dia em que houve mudança. */
function acumular(eventos) {
  const pts = [];
  let total = 0;
  for (const [d, v] of [...eventos].sort((a, b) => a[0] - b[0])) {
    total += v;
    if (pts.length && pts[pts.length - 1][0] === d) pts[pts.length - 1][1] = total; else pts.push([d, total]);
  }
  return pts;
}
function valorEm(pts, d) {
  let v = 0;
  for (const p of pts) { if (p[0] > d) break; v = p[1]; }
  return v;
}
/** Os pontos entre os dias "de" e "ate", a começar pelo valor que havia no dia "de". */
const recortar = (pts, de, ate) => [[de, valorEm(pts, de)], ...pts.filter(p => p[0] > de && p[0] <= ate)];

const eventosFicha = f => f.movimentos.map(m => [diaDe(m.data), m.valor]);
const eventosDividas = () => gruposDe('dividas').flatMap(g => g.fichas.flatMap(eventosFicha));
function eventosConta(c) {
  let antes = 0;
  return c.hist.map(h => { const e = [diaDe(h.data), h.valor - antes]; antes = h.valor; return e; });
}
/**
 * Contas no total + dívidas, a partir do primeiro registo de uma conta (antes disso não se sabe o total).
 * Antes do primeiro registo de cada conta conta-se com esse primeiro valor, que é o melhor que se sabe:
 * assim, registar o passado de uma só conta não faz parecer que as outras apareceram do nada.
 */
function serieTotal() {
  const contas = db.contas.filter(c => c.noTotal);
  const inicio = contas.length ? Math.min(...contas.map(c => diaDe(c.hist[0].data))) : null;
  const ev = contas.flatMap(c => eventosConta(c).map((e, i) => i ? e : [inicio, e[1]]));
  const pts = acumular([...ev, ...eventosDividas()]);
  return { pts, inicio: inicio ?? (pts.length ? pts[0][0] : null) };
}

/* ---------- gráficos ---------- */
// Desenhados em SVG à mão (sem bibliotecas, para a app continuar a funcionar sem internet).
// Ao arrastar o dedo, o valor e a data aparecem no cartão por cima, como na app Bolsa.
const graficos = []; // um registo por gráfico no ecrã, refeito a cada render()
const larguraGraf = () => Math.max(200, Math.min(document.documentElement.clientWidth, 640) - 64);
const r1 = n => Math.round(n * 10) / 10;
const rotuloY = c => fmtCompacto.format(c / 100);

function bonito(x) {
  const p = 10 ** Math.floor(Math.log10(x)), f = x / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
/** Limites redondos do eixo vertical e as linhas da grelha (em cêntimos). */
function escala(lo, hi) {
  if (lo > 0 && lo < hi / 2) lo = 0;
  if (hi < 0 && hi > lo / 2) hi = 0;
  if (lo === hi) { lo = Math.min(0, lo); hi = Math.max(0, hi) || 100; }
  const passo = Math.max(1, bonito((hi - lo) / 3));
  lo = Math.floor(lo / passo) * passo; hi = Math.ceil(hi / passo) * passo;
  const linhas = [];
  for (let i = 0; lo + i * passo <= hi; i++) linhas.push(lo + i * passo);
  return { lo, hi, linhas };
}
function grelha(e, pw, W, py, zeroForte) {
  return e.linhas.map(t => {
    const y = r1(py(t));
    return `<line class="${t === 0 && zeroForte ? 'eixo0' : 'grelha'}" x1="0" x2="${r1(pw)}" y1="${y}" y2="${y}"/>` +
      `<text x="${W}" y="${y + 4}" text-anchor="end">${rotuloY(t)}</text>`;
  }).join('');
}
const margemY = e => Math.max(...e.linhas.map(t => rotuloY(t).length)) * 6.5 + 8;
function rotuloDia(d, span) {
  const x = new Date(d * DIA), m = MESES[x.getUTCMonth()];
  return span <= 120 ? `${x.getUTCDate()} ${m}` : span <= 300 ? m : `${m} ${String(x.getUTCFullYear()).slice(2)}`;
}

/** Linha em escada: o valor mantém-se até à mudança seguinte. "pts" começa no dia "de". */
function grafLinha(pts, de, ate, o = {}) {
  const W = larguraGraf(), H = 150, topo = 8, i = graficos.length;
  const vals = pts.map(p => p[1]);
  const e = escala(Math.min(...vals), Math.max(...vals));
  const pw = W - margemY(e), ph = H - topo, span = ate - de;
  const px = d => (d - de) / span * pw;
  const py = v => topo + (e.hi - v) / (e.hi - e.lo) * ph;
  let traco = `M0 ${r1(py(vals[0]))}`;
  for (let k = 1; k < pts.length; k++) traco += `H${r1(px(pts[k][0]))}V${r1(py(pts[k][1]))}`;
  traco += `H${r1(pw)}`;
  const base = Math.min(e.hi, Math.max(e.lo, 0));
  let svg = `<defs><linearGradient id="ga${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--acc);stop-opacity:.26"/>` +
    `<stop offset="1" style="stop-color:var(--acc);stop-opacity:0"/></linearGradient></defs>` +
    grelha(e, pw, W, py, e.lo < 0) +
    `<path fill="url(#ga${i})" d="${traco}V${r1(py(base))}H0Z"/><path class="traco" d="${traco}"/>`;
  const n = Math.min(pw < 300 ? 3 : 4, span + 1);
  for (let k = 0; k < n; k++) {
    const d = Math.round(de + k * span / (n - 1));
    svg += `<text x="${r1(px(d))}" y="${H + 16}" text-anchor="${k === 0 ? 'start' : k === n - 1 ? 'end' : 'middle'}">${rotuloDia(d, span)}</text>`;
  }
  svg += `<line class="mira" x1="0" x2="0" y1="${topo}" y2="${H}"/>` +
    `<circle class="marca" cx="${r1(pw)}" cy="${r1(py(vals[vals.length - 1]))}" r="4"/><circle class="marca cursor" r="4"/>`;
  graficos.push({ tipo: 'linha', pts, de, ate, px, py, pw, cor: !!o.cor });
  const desc = `${o.rotulo}: ${euro(vals[0])} em ${dataPT(isoDe(de))}, ${euro(vals[vals.length - 1])} em ${dataPT(isoDe(ate))}`;
  return `<div class="graf" data-g="${i}" tabindex="0" role="img" aria-label="${esc(desc)}"><svg width="${W}" height="${H + 22}" aria-hidden="true">${svg}</svg></div>`;
}

/** Colunas (uma por mês), com o último mês destacado. A ponta é arredondada, a base é direita. */
function grafColunas(barras, o = {}) {
  const W = larguraGraf(), H = 150, topo = 8;
  const vals = barras.map(b => b.valor);
  const e = escala(Math.min(0, ...vals), Math.max(0, ...vals));
  const pw = W - margemY(e), ph = H - topo;
  const banda = pw / barras.length, larg = Math.min(24, banda * .62);
  const py = v => topo + (e.hi - v) / (e.hi - e.lo) * ph, y0 = py(0);
  const salto = Math.ceil(26 / banda); // rótulos de x em meses alternados se não couberem
  let svg = grelha(e, pw, W, py, true);
  barras.forEach((b, i) => {
    const x = i * banda + (banda - larg) / 2, y1 = py(b.valor), h = Math.abs(y1 - y0);
    const r = Math.min(4, larg / 2, h), s = y1 < y0 ? 1 : -1;
    const d = h < .5 ? 'M0 0' : `M${r1(x)} ${r1(y0)}V${r1(y1 + s * r)}Q${r1(x)} ${r1(y1)} ${r1(x + r)} ${r1(y1)}H${r1(x + larg - r)}Q${r1(x + larg)} ${r1(y1)} ${r1(x + larg)} ${r1(y1 + s * r)}V${r1(y0)}Z`;
    svg += `<path class="coluna${i === barras.length - 1 ? ' on' : ''}" d="${d}"/>`;
    if ((barras.length - 1 - i) % salto === 0) svg += `<text x="${r1(x + larg / 2)}" y="${H + 16}" text-anchor="middle">${esc(b.rot)}</text>`;
  });
  const i = graficos.push({ tipo: 'colunas', barras, banda }) - 1;
  const desc = `${o.rotulo}: ` + barras.map(b => `${b.nome} ${euro(b.valor)}`).join(', ');
  return `<div class="graf" data-g="${i}" tabindex="0" role="img" aria-label="${esc(desc)}"><svg width="${W}" height="${H + 22}" aria-hidden="true">${svg}</svg></div>`;
}

/** Mostra no cartão o valor do gráfico na posição x (em píxeis, a partir da esquerda do gráfico). */
function mostrar(el, x) {
  const g = graficos[+el.dataset.g];
  if (!g) return;
  let valor, leg;
  if (g.tipo === 'linha') {
    const d = Math.max(g.de, Math.min(g.ate, Math.round(g.de + x / g.pw * (g.ate - g.de))));
    valor = valorEm(g.pts, d); leg = dataPT(isoDe(d)); g.atual = d;
    el.querySelector('.mira').setAttribute('transform', `translate(${r1(g.px(d))} 0)`);
    const c = el.querySelector('.cursor');
    c.setAttribute('cx', r1(g.px(d))); c.setAttribute('cy', r1(g.py(valor)));
  } else {
    const i = Math.max(0, Math.min(g.barras.length - 1, Math.floor(x / g.banda)));
    valor = g.barras[i].valor; leg = g.barras[i].nome; g.atual = i;
    el.querySelectorAll('.coluna').forEach((c, j) => c.classList.toggle('on', i === j));
  }
  const cartao = el.closest('.cartao');
  const v = cartao.querySelector('[data-ler="valor"]'), l = cartao.querySelector('[data-ler="leg"]');
  if (!g.orig) g.orig = [v.innerHTML, v.className, l.innerHTML];
  v.innerHTML = euroG(valor);
  v.className = 'valor-m' + (g.cor ? ' ' + cor(valor) : '');
  l.textContent = leg;
  el.classList.add('ativo');
}
function esconder(el) {
  const g = graficos[+el.dataset.g];
  if (!g?.orig) return;
  const cartao = el.closest('.cartao');
  const v = cartao.querySelector('[data-ler="valor"]'), l = cartao.querySelector('[data-ler="leg"]');
  [v.innerHTML, v.className, l.innerHTML] = g.orig;
  g.orig = null; g.atual = null;
  if (g.tipo === 'colunas') el.querySelectorAll('.coluna').forEach((c, j) => c.classList.toggle('on', j === g.barras.length - 1));
  el.classList.remove('ativo');
}
/** Setas do teclado: salta para a mudança (ou coluna) seguinte. */
function passoGraf(el, sentido) {
  const g = graficos[+el.dataset.g];
  if (g.tipo === 'linha') {
    const dias = [...new Set([g.de, ...g.pts.map(p => p[0]), g.ate])];
    const atual = g.atual ?? (sentido > 0 ? g.de - 1 : g.ate + 1);
    const d = sentido > 0 ? dias.find(x => x > atual) : dias.findLast(x => x < atual);
    if (d != null) mostrar(el, g.px(d));
  } else {
    const i = (g.atual ?? (sentido > 0 ? -1 : g.barras.length)) + sentido;
    mostrar(el, (Math.max(0, Math.min(g.barras.length - 1, i)) + .5) * g.banda);
  }
}

/**
 * Evolução até hoje, recortada pelo período escolhido (1M, 3M, 1A, Tudo).
 * Devolve o gráfico, os filtros de período e a variação no período, ou null se ainda não há história.
 */
function evolucao(pts, inicio, o = {}) {
  if (inicio == null) return null;
  const ate = Math.max(diaDe(hoje()), pts.length ? pts[pts.length - 1][0] : 0);
  const [, texto, dias] = PERIODOS.find(p => p[0] === ui.periodo) || PERIODOS[3];
  const de = Math.max(inicio, ate - dias);
  if (de >= ate) return null;
  const r = recortar(pts, de, ate);
  const v0 = r[0][1], dv = r[r.length - 1][1] - v0;
  const pct = v0 > 0 && dv ? ` (${fmtPct.format(Math.abs(dv) / v0)})` : '';
  return {
    texto: `${dv > 0 ? '▲' : dv < 0 ? '▼' : '='} ${euro(Math.abs(dv))}${pct}`,
    cls: cor(dv),
    quando: de === ate - dias ? texto : 'desde ' + dataPT(isoDe(de)),
    graf: grafLinha(r, de, ate, o),
    filtros: `<div class="chips">${PERIODOS.map(([id]) =>
      `<button data-a="periodo" data-id="${id}" class="${ui.periodo === id ? 'on' : ''}">${id}</button>`).join('')}</div>`,
  };
}
/** Evolução de uma pessoa (até hoje) ou de um gasto (do primeiro ao último movimento). */
function grafFicha(f, div) {
  const pts = acumular(eventosFicha(f));
  if (!pts.length) return '';
  const de = pts[0][0], ate = div ? Math.max(diaDe(hoje()), pts[pts.length - 1][0]) : pts[pts.length - 1][0];
  return de < ate ? grafLinha(recortar(pts, de, ate), de, ate, { cor: div, rotulo: div ? 'Saldo ao longo do tempo' : 'Gasto acumulado' }) : '';
}
/** Gastos de todos os grupos, somados por mês (até 12 meses). Devolve o gráfico, o último mês e a média. */
function grafGastosMes() {
  const porMes = new Map();
  for (const g of gruposDe('gastos')) for (const f of g.fichas) for (const m of f.movimentos) {
    const k = m.data.slice(0, 7);
    porMes.set(k, (porMes.get(k) || 0) + m.valor);
  }
  if (!porMes.size) return null;
  const chaves = [...porMes.keys()].sort();
  let [a, m] = chaves[0].split('-').map(Number);
  const [af, mf] = (chaves[chaves.length - 1] > hoje() ? chaves[chaves.length - 1] : hoje().slice(0, 7)).split('-').map(Number);
  const barras = [];
  while (a < af || (a === af && m <= mf)) {
    const k = `${a}-${String(m).padStart(2, '0')}`;
    barras.push({ rot: MESES[m - 1], nome: `${MESES_LONGOS[m - 1]} de ${a}`, valor: porMes.get(k) || 0 });
    if (++m > 12) { m = 1; a++; }
  }
  if (barras.length < 2) return null;
  const ult = barras.slice(-12);
  return {
    graf: grafColunas(ult, { rotulo: 'Gastos por mês' }),
    atual: ult[ult.length - 1],
    media: Math.round(ult.reduce((s, b) => s + b.valor, 0) / ult.length),
  };
}

/**
 * Barra de distribuição (parte do todo) das partes com valor positivo. As linhas por baixo servem de legenda:
 * slot(i) é a cor do avatar de cada linha (−1 é cinzento) e pct(i) a percentagem. A cor segue a posição na lista.
 */
function distribuicao(partes) {
  const n = partes.length, slot = i => n > 8 && i >= 7 ? -1 : i;
  const corDe = i => slot(i) < 0 ? 'var(--c0)' : `var(--c${i + 1})`;
  const vis = partes.map((p, i) => ({ ...p, i })).filter(p => p.valor > 0);
  if (vis.length < 2) return { barra: '', slot, pct: () => '' };
  const total = vis.reduce((s, p) => s + p.valor, 0), pct = v => fmtPct.format(v / total);
  const desc = 'Distribuição: ' + vis.map(p => `${p.nome} ${pct(p.valor)}`).join(', ');
  return {
    barra: `<div class="comp-bloco"><div class="comp" role="img" aria-label="${esc(desc)}">${vis.map(p =>
      `<span style="flex:${p.valor} 1 0;background:${corDe(p.i)}" title="${esc(p.nome)}: ${euro(p.valor)} (${pct(p.valor)})"></span>`).join('')}</div></div>`,
    slot,
    pct: i => partes[i].valor > 0 ? pct(partes[i].valor) : '',
  };
}

/* ---------- vistas ---------- */
/** "Dinheiro vivo" → "DV", "Interrail 2026" → "I" (as palavras sem letras não contam). */
const iniciais = n => (String(n).trim().split(/\s+/).filter(p => /^\p{L}/u.test(p)).slice(0, 2).map(p => [...p][0]).join('') || [...String(n).trim()][0] || '?').toUpperCase();
// Cor do avatar a partir do nome, sem o verde e o vermelho (que nesta app querem dizer "a receber" e "a pagar").
const SLOTS_NOME = [0, 1, 2, 3, 4, 6];
const slotNome = n => SLOTS_NOME[[...String(n)].reduce((h, c) => (h * 31 + c.codePointAt(0)) % 9973, 7) % SLOTS_NOME.length];
/** Círculo com as iniciais, como os contactos numa app de banco. slot é a cor (0 a 7, ou −1 para cinzento). */
function avatar(nome, slot = slotNome(nome), cls = '') {
  const k = slot < 0 ? 0 : slot + 1;
  return `<span class="avatar ${cls}" style="background:var(--c${k});color:var(--t${k})" aria-hidden="true">${esc(iniciais(nome))}</span>`;
}
const avatarIcone = icone => `<span class="avatar" aria-hidden="true">${icone}</span>`;

/** Valor em grande com os cêntimos mais pequenos: "11 621" + ",42 €". */
function euroG(c) {
  let a = '', b = '', depois = false;
  for (const p of fmtEuro.formatToParts(c / 100)) {
    if (p.type === 'decimal') depois = true;
    if (depois) b += p.value; else a += p.value;
  }
  return `${esc(a)}<small>${esc(b)}</small>`;
}

function barra({ voltar = '', titulo = '', acoes = '' } = {}) {
  const esq = voltar ? `<button class="icbtn" data-a="voltar" aria-label="Voltar a ${esc(voltar)}">${ic.voltar}</button>`
    : titulo ? `<span class="marca">${esc(titulo)}</span>` : '<span></span>';
  return `<div class="barra">${esq}<div class="acoes">${acoes}</div></div>`;
}
const cab = (titulo, o = {}) => barra(o) + `<h1>${esc(titulo)}</h1>`;
const cabCartao = (titulo, dir = '') => `<div class="cartao-cab"><h2>${esc(titulo)}</h2>${dir}</div>`;
const verTudo = (tab, texto) => `<button class="lig" data-a="tab" data-id="${tab}">${texto}</button>`;
const botaoAcao = (a, icone, texto, id = '') =>
  `<button class="acao-red" data-a="${a}"${id ? ` data-id="${esc(id)}"` : ''}><span class="circ">${icone}</span>${esc(texto)}</button>`;

function linha(titulo, valor, o = {}) {
  const tag = o.a ? 'button' : 'div';
  const attrs = o.a ? ` data-a="${o.a}" data-id="${esc(o.id ?? '')}"${o.tipo ? ` data-tipo="${o.tipo}"` : ''}` : '';
  return `<${tag} class="linha"${attrs}>${o.avatar || ''}<div class="txt"><div class="tit ${o.tituloCls || ''}">${esc(titulo)}</div>${o.sub ? `<div class="sub">${esc(o.sub)}</div>` : ''}</div><div class="val ${o.cls || ''}">${valor}</div></${tag}>`;
}
function linhaOrdenar(nome, a, id, i, n) {
  return `<div class="linha">${avatar(nome)}<div class="txt tit">${esc(nome)}</div>
    <button class="mini" data-a="${a}" data-id="${id}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="Subir">↑</button>
    <button class="mini" data-a="${a}" data-id="${id}" data-d="1" ${i === n - 1 ? 'disabled' : ''} aria-label="Descer">↓</button></div>`;
}
const btnOrdenar = () => `<button class="txtbtn" data-a="ordenar">${ui.ordenar ? 'OK' : 'Ordenar'}</button>`;
const btnAdicionar = (a, texto, id = '') => `<button class="linha acao" data-a="${a}"${id ? ` data-id="${id}"` : ''}>${avatarIcone(ic.mais)}${esc(texto)}</button>`;

/** Cartão de um gráfico: título e filtros em cima, depois a leitura (que muda ao tocar no gráfico) e o gráfico. */
function cartaoGraf({ titulo, valor = '', cls = '', leg = '', graf = '', filtros = '' }) {
  return `<section class="cartao">${cabCartao(titulo, filtros)}
    <div class="leitura"><div class="valor-m ${cls}" data-ler="valor">${valor}</div><div class="leg" data-ler="leg">${leg}</div></div>${graf}</section>`;
}
const cartaoEvolucao = ev => cartaoGraf({ titulo: 'Evolução', valor: esc(ev.texto), cls: ev.cls, leg: esc(ev.quando), graf: ev.graf, filtros: ev.filtros });
const cartaoTexto = (titulo, texto) => `<section class="cartao">${cabCartao(titulo)}<p class="texto">${texto}</p></section>`;

function textoCopia() {
  const d = lerPref('copia', null);
  if (!d) return '<b>Ainda não guardaste nenhuma cópia de segurança.</b>';
  const n = diaDe(hoje()) - diaDe(d), quando = n <= 0 ? 'hoje' : n === 1 ? 'ontem' : `há ${n} dias`;
  return n > 30 ? `<b>A última cópia de segurança foi ${quando}.</b>` : `Última cópia de segurança: ${quando}.`;
}

/** As contas, com o avatar na cor da barra de distribuição (a lista serve de legenda). */
function blocoContas() {
  const noTotal = db.contas.filter(c => c.noTotal), dist = distribuicao(noTotal);
  return dist.barra + db.contas.map(c => {
    const j = noTotal.indexOf(c);
    return linha(c.nome, euro(c.valor), {
      a: 'abrir', tipo: 'contas', id: c.id, cls: j < 0 ? 'sec' : '',
      avatar: avatar(c.nome, j < 0 ? -1 : dist.slot(j)),
      sub: [c.nota, j < 0 ? 'fora do total' : dist.pct(j)].filter(Boolean).join(' · '),
    });
  }).join('');
}

/** Os últimos movimentos de dívidas e gastos, do mais recente para o mais antigo. */
function recentes(n) {
  const L = [];
  for (const g of db.grupos) for (const f of g.fichas) f.movimentos.forEach((m, i) => L.push({ m, f, g, i }));
  return L.sort((a, b) => a.m.data < b.m.data ? 1 : a.m.data > b.m.data ? -1 : b.i - a.i).slice(0, n);
}
// Como num extrato: um gasto é dinheiro que sai (−) e um reembolso entra (+, a verde); nas dívidas, + é o que te devem.
const linhaRecente = ({ m, f, g }) => {
  const gasto = g.tipo === 'gastos', v = gasto ? -m.valor : m.valor;
  return linha(m.desc || f.nome, euroSinal(v), {
    a: 'abrir', tipo: g.tipo, id: f.id, avatar: avatar(f.nome), sub: `${f.nome} · ${dataPT(m.data)}`,
    cls: gasto ? (v > 0 ? 'pos' : '') : v < 0 ? 'neg' : '',
  });
};

function vResumo() {
  const tc = totalContas(), td = totalDividas();
  const vazio = !db.contas.length && db.grupos.every(g => !g.fichas.length);
  const s = serieTotal(), ev = evolucao(s.pts, s.inicio, { rotulo: 'Evolução do total' });
  const olho = `<button class="icbtn" data-a="ocultar" aria-label="${ui.oculto ? 'Mostrar valores' : 'Ocultar valores'}">${ui.oculto ? ic.olhoFechado : ic.olho}</button>`;
  let h = `<header class="heroi">${barra({ titulo: 'Dinheiro', acoes: olho })}
    <div class="heroi-centro"><div class="heroi-rot">Total · contas e dívidas</div>
      <div class="valor-g">${euroG(tc + td)}</div>
      ${ev ? `<span class="pilula">${esc(ev.texto)} ${esc(ev.quando)}</span>` : ''}</div>
    <div class="botoes-acao">${botaoAcao('rapido', ic.atualizar, 'Atualizar', 'contas')}${botaoAcao('rapido', ic.trocar, 'Dívida', 'dividas')}${botaoAcao('rapido', ic.gastos, 'Gasto', 'gastos')}${botaoAcao('menu-copias', ic.mais3, 'Mais')}</div>
  </header>`;
  if (vazio) {
    h += `<section class="cartao">${cabCartao('Começar')}
      <p class="texto">Primeira vez? Cola o texto que copiei no teu Mac, ou escolhe o ficheiro <b>dinheiro-dados-iniciais.json</b>.</p>
      <button class="linha acao" data-a="colar">${avatarIcone(ic.mais)}Colar os meus dados</button>
      <button class="linha acao" data-a="repor">${avatarIcone(ic.ficheiro)}Importar de um ficheiro</button></section>`;
  } else {
    if (emEcraInteiro()) h += cartaoSafari();
    if (lerPref('atalho', '') && lerPref('atalho', '') !== 'oculto') h += cartaoAtalho();
    h += ev ? cartaoEvolucao(ev) : cartaoTexto('Evolução', 'O gráfico aparece à medida que atualizas o valor das contas.');
  }
  if (db.contas.length) h += `<section class="cartao">${cabCartao('Contas', verTudo('contas', 'Ver todas'))}${blocoContas()}</section>`;
  const gd = gruposDe('dividas').filter(g => g.fichas.length);
  if (gd.length) h += `<section class="cartao">${cabCartao('Dívidas', verTudo('dividas', 'Ver tudo'))}` + gd.map(g => {
    const t = totalGrupo(g), n = g.fichas.length;
    return linha(g.nome, euro(t), { a: 'tab', id: 'dividas', cls: cor(t), avatar: avatarIcone(ic.dividas), sub: `${n} ${n === 1 ? 'pessoa' : 'pessoas'}` });
  }).join('') + '</section>';
  const rec = recentes(5);
  if (rec.length) h += `<section class="cartao">${cabCartao('Movimentos recentes')}${rec.map(linhaRecente).join('')}</section>`;
  const gf = gruposDe('gastos').flatMap(g => g.fichas);
  if (gf.length) h += `<section class="cartao">${cabCartao('Gastos', verTudo('gastos', 'Ver tudo'))}` + gf.map(f => {
    const n = f.movimentos.length;
    return linha(f.nome, euro(totalFicha(f)), { a: 'abrir', tipo: 'gastos', id: f.id, avatar: avatar(f.nome), sub: `${n} ${n === 1 ? 'movimento' : 'movimentos'}` });
  }).join('') + '</section>';
  if (!vazio && !lerPref('atalho', '')) h += cartaoAtalho();
  h += `<section class="cartao">${cabCartao('Cópia de segurança')}
    <p class="texto">Os dados ficam só neste iPhone. ${vazio ? '' : textoCopia()} Guarda uma cópia de vez em quando (por exemplo em Ficheiros → iCloud Drive).</p>
    <div class="botoes-linha"><button class="btn-pri" data-a="backup">Guardar cópia</button><button class="btn-sec" data-a="menu-copias">Mais opções</button></div></section>`;
  return h;
}

function vContas() {
  const acoes = btnOrdenar() + `<button class="icbtn" data-a="nova-conta" aria-label="Nova conta">${ic.mais}</button>`;
  const n = db.contas.length;
  return cab('Contas', { acoes }) +
    `<div class="cab-valor"><div class="rot">Total nas contas</div><div class="valor-g">${euroG(totalContas())}</div></div>
    <section class="cartao">${ui.ordenar ? db.contas.map((c, i) => linhaOrdenar(c.nome, 'mover-conta', c.id, i, n)).join('') : blocoContas()}
      ${n ? '' : '<p class="texto" style="padding-top:12px">Ainda não tens contas.</p>'}${btnAdicionar('nova-conta', 'Nova conta')}</section>`;
}

function vConta() {
  const c = db.contas.find(c => c.id === ui.ficha.contas);
  const ev = evolucao(acumular(eventosConta(c)), diaDe(c.hist[0].data), { rotulo: 'Evolução de ' + c.nome });
  const rot = [c.nome, c.noTotal ? '' : 'fora do total'].filter(Boolean).join(' · ');
  let h = `<header class="heroi">${barra({ voltar: 'Contas' })}
    <div class="heroi-centro"><div class="heroi-rot">${esc(rot)}</div><div class="valor-g">${euroG(c.valor)}</div>
      ${ev ? `<span class="pilula">${esc(ev.texto)} ${esc(ev.quando)}</span>` : c.nota ? `<span class="pilula">${esc(c.nota)}</span>` : ''}</div>
    <div class="botoes-acao">${botaoAcao('novo-hist', ic.atualizar, 'Atualizar')}${botaoAcao('editar-conta', ic.editar, 'Editar')}${botaoAcao('menu-conta', ic.mais3, 'Mais')}</div>
  </header>`;
  h += ev ? cartaoEvolucao(ev) : cartaoTexto('Evolução', 'Atualiza o valor de vez em quando para veres aqui a evolução.');
  h += `<section class="cartao">${cabCartao('Histórico')}` + c.hist.map((x, i) => {
    const dif = i ? x.valor - c.hist[i - 1].valor : null;
    return linha(dataPT(x.data), euro(x.valor), {
      a: 'hist', id: i, avatar: avatarIcone(dif === null ? ic.contas : dif > 0 ? ic.sobe : dif < 0 ? ic.desce : ic.igual),
      sub: dif === null ? 'valor inicial' : dif ? euroSinal(dif) : 'sem alteração',
    });
  }).reverse().join('') + `${btnAdicionar('novo-hist', 'Atualizar valor')}</section>
    <p class="rodape">Cada vez que atualizas o valor, fica um registo com a data. É daqui que vem o gráfico.</p>`;
  return h;
}

function linhaFicha(f, div) {
  const t = totalFicha(f), tem = f.movimentos.length > 0;
  return linha(f.nome, tem ? euro(t) : '—', {
    a: 'abrir', tipo: div ? 'dividas' : 'gastos', id: f.id, avatar: avatar(f.nome),
    sub: [expressao(f), f.nota].filter(Boolean).join(' · '),
    cls: tem ? (div ? cor(t) : '') : 'ter',
  });
}

function vGrupos(tipo) {
  const div = tipo === 'dividas', gs = gruposDe(tipo);
  const total = gs.reduce((s, g) => s + totalGrupo(g), 0);
  const acoes = btnOrdenar() + `<button class="icbtn" data-a="novo-grupo" aria-label="Novo grupo">${ic.pasta}</button>`;
  let h = cab(div ? 'Dívidas' : 'Gastos', { acoes }) +
    `<div class="cab-valor"><div class="rot">${div ? 'A receber' : 'Total gasto'}</div><div class="valor-g ${div ? cor(total) : ''}">${euroG(total)}</div></div>`;
  if (div) {
    const pts = acumular(eventosDividas());
    const ev = evolucao(pts, pts.length ? pts[0][0] : null, { cor: true, rotulo: 'Evolução do que tens a receber' });
    if (ev) h += cartaoEvolucao(ev);
  } else {
    const gm = grafGastosMes();
    if (gm) h += cartaoGraf({ titulo: 'Por mês', valor: euroG(gm.atual.valor), leg: esc(`${gm.atual.nome} · média de ${euro(gm.media)} por mês`), graf: gm.graf });
  }
  for (const g of gs) {
    const n = g.fichas.length;
    h += `<section class="cartao">${cabCartao(g.nome, `<span class="dir">${euro(totalGrupo(g))}
      <button class="icbtn peq" data-a="menu-grupo" data-id="${g.id}" aria-label="Opções de ${esc(g.nome)}">${ic.mais3}</button></span>`)}` +
      g.fichas.map((f, i) => ui.ordenar ? linhaOrdenar(f.nome, 'mover-ficha', f.id, i, n) : linhaFicha(f, div)).join('') +
      btnAdicionar('nova-ficha', div ? 'Adicionar pessoa' : 'Adicionar item', g.id) + '</section>';
  }
  if (!gs.length) h += `<p class="rodape" style="margin-top:0">Ainda não há grupos. Cria um com o botão em cima.</p>`;
  return h;
}

function vFicha(tipo) {
  const [, f] = acharFicha(ui.ficha[tipo]);
  const div = tipo === 'dividas', t = totalFicha(f);
  const legenda = !div ? 'gasto total' : t > 0 ? `${f.nome} deve-te` : t < 0 ? `deves a ${f.nome}` : 'contas saldadas';
  const saldar = div && t ? botaoAcao('saldar', ic.certo, t > 0 ? 'Pagou tudo' : 'Paguei tudo') : '';
  let h = barra({ voltar: div ? 'Dívidas' : 'Gastos' }) + `<div class="perfil">${avatar(f.nome, slotNome(f.nome), 'grande')}<h1>${esc(f.nome)}</h1>
    <div class="valor-g ${div ? cor(t) : ''}">${euroG(t)}</div><div class="leg">${esc(legenda)}</div>
    <div class="botoes-acao">${botaoAcao('novo-mov', ic.mais, 'Adicionar')}${saldar}${botaoAcao('menu-ficha', ic.mais3, 'Mais')}</div></div>`;
  const graf = grafFicha(f, div);
  if (graf) h += cartaoGraf({
    titulo: div ? 'Saldo' : 'Gasto acumulado', valor: euroG(t), cls: div ? cor(t) : '',
    leg: esc('desde ' + dataPT(movOrdenados(f)[0].data)), graf,
  });
  h += `<section class="cartao">${cabCartao('Movimentos')}` +
    movOrdenados(f).map(m => linha(m.desc || '—', euroSinal(m.valor), {
      a: 'mov', id: m.id, avatar: avatar(m.desc || f.nome), sub: dataPT(m.data), cls: m.valor < 0 ? 'neg' : '', tituloCls: m.desc ? '' : 'sec',
    })).join('') + `${btnAdicionar('novo-mov', 'Adicionar')}</section>`;
  h += `<section class="cartao">${cabCartao('Nota')}<textarea class="nota" data-campo="nota" rows="2" placeholder="${div ? 'Ex.: deve-me um brasão' : 'Notas'}">${esc(f.nota)}</textarea></section>`;
  return h;
}

function vTabs() {
  const tabs = [['resumo', 'Início'], ['contas', 'Contas'], ['dividas', 'Dívidas'], ['gastos', 'Gastos']];
  return `<nav class="tabs">${tabs.map(([id, nome]) =>
    `<button data-a="tab" data-id="${id}" class="${ui.tab === id ? 'on' : ''}">${ic[id]}<span>${nome}</span></button>`).join('')}</nav>`;
}

function render() {
  const t = ui.tab;
  let html;
  graficos.length = 0;
  if (t === 'resumo') html = vResumo();
  else if (t === 'contas') {
    if (!db.contas.some(c => c.id === ui.ficha.contas)) ui.ficha.contas = null;
    html = ui.ficha.contas ? vConta() : vContas();
  }
  else if (ui.ficha[t] && acharFicha(ui.ficha[t])[1]) html = vFicha(t);
  else { ui.ficha[t] = null; html = vGrupos(t); }
  $('#app').innerHTML = `<main class="pagina ${ui.anim}">${html}</main>${vTabs()}`;
  ui.anim = '';
}

/* ---------- folhas e menus ---------- */
function abrir(c) {
  camada = c;
  const el = $('#camada');
  el.className = '';
  el.innerHTML = '<div class="fundo" data-a="fechar"></div>' + (c.tipo === 'acoes' ? vAcoes(c) : vFolha(c));
  document.documentElement.classList.add('travado');
  const foco = el.querySelector('[autofocus]');
  if (foco) { foco.focus(); if (foco.value) foco.select(); }
  c.depois?.();
}
function fechar() {
  const aFechar = camada, el = $('#camada');
  if (!aFechar) return;
  el.classList.add('saindo');
  document.activeElement?.blur();
  setTimeout(() => {
    if (camada !== aFechar) return; // entretanto abriu-se outra
    camada = null; el.innerHTML = ''; el.className = '';
    document.documentElement.classList.remove('travado');
  }, 240);
}
// Folha que sobe de baixo: título grande, os campos, o botão principal e, no fim, o botão de apagar (extra).
function vFolha(c) {
  return `<div class="folha" role="dialog" aria-label="${esc(c.titulo)}">
    <div class="folha-barra"><button class="icbtn" data-a="fechar" aria-label="Cancelar">${ic.fechar}</button></div>
    <div class="folha-corpo"><h2 class="folha-tit">${esc(c.titulo)}</h2>${c.corpo}
      <button class="btn-pri largo" data-a="guardar-folha">${c.ok || 'Guardar'}</button>${c.extra || ''}</div></div>`;
}
const btnApagar = (a, id, texto) => `<section class="cartao"><button class="linha acao perigo" data-a="${a}" data-id="${id}">${avatarIcone(ic.lixo)}${texto}</button></section>`;
function vAcoes(c) {
  return `<div class="folha-acoes" role="dialog"><div class="grupo-acoes">
    ${c.titulo ? `<div class="titulo-acoes">${esc(c.titulo)}</div>` : ''}
    ${c.botoes.map((b, i) => `<button data-a="acao" data-id="${i}" class="${b.perigo ? 'perigo' : ''}">${esc(b.texto)}</button>`).join('')}
    </div><button class="cancelar-acoes" data-a="fechar">Cancelar</button></div>`;
}
const acoes = (titulo, botoes) => abrir({ tipo: 'acoes', titulo, botoes });
/** Pede confirmação; depois de feito, o aviso em baixo tem "Desfazer". */
const confirmar = (titulo, texto, fn, desfazer = 'Apagado') => acoes(titulo, [{ texto, perigo: true, fn, desfazer }]);
/** Guarda o estado atual e devolve uma função que o repõe (para o botão "Desfazer"). */
function pontoDeRetorno() {
  const antes = JSON.stringify(db);
  return () => { db = JSON.parse(antes); };
}
function erro(sel) {
  const el = $(sel); el.closest('.cartao')?.classList.remove('abanar');
  void el.offsetWidth; el.closest('.cartao')?.classList.add('abanar'); el.focus();
  return false;
}

function pedirNome(titulo, valor, ok) {
  abrir({
    tipo: 'folha', titulo, ok: 'OK',
    corpo: `<div class="cartao"><div class="linha"><input id="f-nome" placeholder="Nome" value="${esc(valor)}" autocomplete="off" autofocus></div></div>`,
    guardar: () => { const n = $('#f-nome').value.trim(); if (!n) return erro('#f-nome'); ok(n); return true; },
  });
}

// O valor de uma conta que já existe muda-se em "Atualizar valor" (folhaHist), para ficar no histórico.
function folhaConta(id) {
  const c = db.contas.find(c => c.id === id);
  abrir({
    tipo: 'folha', titulo: c ? 'Editar conta' : 'Nova conta',
    corpo: `<div class="cartao">
        <div class="linha"><input id="f-nome" placeholder="Nome" value="${esc(c?.nome)}" autocomplete="off" autofocus></div>

function textoExportar() {
  const L = ['Dinheiro — ' + new Date().toLocaleDateString('pt-PT', { day: 'numeric', month: 'long', year: 'numeric' }), ''];

/* ---------- atalho do iPhone ---------- */
// O atalho (app Atalhos) acrescenta uma linha por movimento a um ficheiro no iCloud Drive:
//   2026-10-09T10:30:15+01:00;mais;Mãe;12,5;jantar      (dívida: alguém fica a dever-te)
//   2026-10-09T11:02:40+01:00;menos;João;5;café         (dívida negativa: desconta)
//   2026-10-09T12:15:03+01:00;gasto;Revolut;23,4;gasolina (gasto: sai do saldo da conta)
// isto é: data;tipo;quem ou de que conta;valor;descrição. Também aceita data;tipo;"12,50 Mãe jantar".
// A data pode vir em ISO (como acima), curta ("09/10/26, 10:30") ou por extenso ("9 de outubro de 2026").
// A app não consegue ler o ficheiro sozinha: é escolhido em "Importar do atalho" e só entram as linhas novas.
const norm = s => String(s).normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().replace(/\s+/g, ' ').trim();

/**
 * Separa "12,50 Mãe jantar" em valor, nome e descrição. Procura primeiro um nome que já exista na app
 * (o mais comprido, em qualquer posição, e pode ter números, como "Interrail 2026"); depois, o valor.
 */
function lerTextoAtalho(texto, nomes) {
  const pal = texto.trim().split(/\s+/).filter(p => p && !/^(€|eur)$/i.test(p));
  const conhecidos = new Set(nomes.map(norm));
  let nome = '', resto = pal;
  for (let n = pal.length; n > 0 && !nome; n--) {
    for (let i = 0; i + n <= pal.length; i++) {
      if (!conhecidos.has(norm(pal.slice(i, i + n).join(' ')))) continue;
      nome = pal.slice(i, i + n).join(' ');
      resto = [...pal.slice(0, i), ...pal.slice(i + n)];
      break;
    }
  }
  // milhares com espaço ("1 200,5") só depois de tirar o nome, que pode ter números ("Interrail 2026 120")
  resto = resto.join(' ').replace(/(\d)\s(?=\d{3}(?:[.,]\d+)?(?:\s|$))/g, '$1').split(' ').filter(Boolean);
  const iv = resto.findIndex(p => /\d/.test(p) && lerValor(p));
  if (iv < 0) return null;
  const valor = Math.abs(lerValor(resto[iv]));
  resto = resto.filter((_, k) => k !== iv);
  if (!nome) nome = resto.shift() || '';
  return { valor, nome, desc: resto.join(' ') };
}
/** Valor escrito pelo atalho. Os Atalhos não põem zeros no fim, por isso "1,200" só pode ser mil e duzentos. */
function valorAtalho(texto) {
  const s = String(texto).replace(/[^\d,.+\-−]/g, '');
  return /^[+-]?[1-9]\d{0,2}(,\d{3})+$/.test(s) ? lerValor(s.replace(/,/g, '')) : lerValor(s);
}
/** A data no início da linha: ISO ("2026-10-09T10:30…"), curta ("09/10/26, 10:30") ou por extenso ("9 de outubro de 2026"). */
function dataAtalho(texto) {
  let d = null, m;
  if ((m = texto.match(/^(\d{4})-(\d{2})-(\d{2})/))) d = m[0];
  else if ((m = texto.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4}|\d{2})(?!\d)/)))
    d = `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  else if ((m = norm(texto).match(/^(?:[a-z-]+,? )?(\d{1,2}) de ([a-z]+)(?: de (\d{4}))?/))) {
    const mes = MESES_LONGOS.map(norm).indexOf(m[2]);
    if (mes >= 0) d = `${m[3] || hoje().slice(0, 4)}-${String(mes + 1).padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  }
  return d && isoDe(diaDe(d)) === d ? d : null; // recusa datas impossíveis, como 31/02
}
function tipoAtalho(texto) {
  const t = norm(texto);
  return t.includes('gast') ? 'gasto' : /neg|^(menos|desc|-|−)|[-−]$/.test(t) ? 'menos' : /^(mais|divida|deve|\+)/.test(t) ? 'mais' : null;
}
/** Uma linha do ficheiro começa um registo novo se tiver data e tipo; as outras são o resto da descrição anterior. */
function comecaRegisto(linha) {
  const p = linha.split(';');
  return p.length >= 3 && (dataAtalho(p[0].trim()) || (/\d/.test(p[0]) && tipoAtalho(p[1])));
}
function lerLinhaAtalho(linha) {
  const p = linha.split(';').map(x => x.trim());
  if (p.length < 3) return null;
  // só os tipos conhecidos: um engano (ex.: "meno") não pode passar a somar dinheiro
  const tipo = tipoAtalho(p[1]);
  if (!tipo) return null;
  const grupo = tipo === 'gasto' ? 'gastos' : 'dividas';
  const nomes = gruposDe(grupo).flatMap(g => g.fichas.map(f => f.nome)).concat(tipo === 'gasto' ? db.contas.map(c => c.nome) : []);
  // data;tipo;nome;valor;descrição — se o 4.º campo parece um número (ou está vazio), é este formato
  const v = p.length >= 5 && /^[-+−\d\s.,€]*$/.test(p[3]) ? valorAtalho(p[3]) : undefined;
  const r = v === undefined ? lerTextoAtalho(p.slice(2).join(';'), nomes)
    : v ? { valor: Math.abs(v), nome: p[2], desc: linha.split(';').slice(4).join(';').trim() } : null;
  if (!r || !r.valor || !r.nome) return null;
  const data = dataAtalho(p[0]);
  return { ...r, tipo, grupo, data: data || hoje(), semData: !data };
}
/**
 * Tira um gasto ao saldo da conta, no histórico, na data do gasto. Os registos de datas posteriores ficam
 * como estão: foram escritos à mão depois do gasto, por isso já o incluem.
 */
function descontar(c, valor, data) {
  if (data < c.hist[0].data) return; // o primeiro registo foi escrito depois do gasto e já o inclui
  let h = c.hist.find(x => x.data === data);
  if (!h) {
    const antes = c.hist.filter(x => x.data < data);
    c.hist.push(h = { data, valor: (antes.length ? antes[antes.length - 1] : c.hist[0]).valor });
  }
  h.valor -= valor;
  ordenarHist(c);
}
/** O grupo deste tipo com este nome; se não existir, é criado no fim. */
function grupoChamado(nome, tipo) {
  let g = gruposDe(tipo).find(g => norm(g.nome) === norm(nome));
  if (!g) db.grupos.push(g = { id: uid(), nome, tipo, fichas: [] });
  return g;
}
/** deLink: veio do link que o atalho abre (um movimento de cada vez), em vez do ficheiro. */
function importarAtalho(texto, deLink = false) {
  const desfaz = pontoDeRetorno();
  if (!Array.isArray(db.atalho)) db.atalho = [];         // linhas já importadas (com o n.º da repetição, para linhas iguais)
  if (!Array.isArray(db.atalhoMaus)) db.atalhoMaus = []; // linhas que não percebi e de que já avisei
  // Uma descrição escrita em várias linhas chega partida: o que não começa um registo junta-se à linha anterior.
  const linhas = [];
  for (const bruta of String(texto).replace(/^﻿/, '').split(/\r\n?|\n/)) {
    const l = bruta.trim();
    if (!l) continue;
    if (linhas.length && !comecaRegisto(l)) linhas[linhas.length - 1] += ' ' + l; else linhas.push(l);
  }
  if (linhas.some(l => norm(l).startsWith('data formatada'))) { toast('No atalho, o último Texto tem os nomes escritos em vez das variáveis (passo 9)'); return; }
  const vistas = new Set([...db.atalho, ...db.atalhoMaus]), repeticoes = new Map(), semConta = new Set();
  let novos = 0, nomesNovos = 0, maus = 0, jaVistas = 0, semData = 0, primeiroMau = '', ultimo = null;
  for (const linha of linhas) {
    const k = (repeticoes.get(linha) || 0) + 1;
    repeticoes.set(linha, k);
    const chave = `${linha}#${k}`;
    if (vistas.has(chave)) { jaVistas++; continue; }
    vistas.add(chave);
    const m = lerLinhaAtalho(linha);
    if (!m) { maus++; primeiroMau ||= dataAtalho(linha) ? linha.replace(/^[^;]*;/, '') : linha; db.atalhoMaus.push(chave); continue; }
    if (m.semData) semData++;
    // "João (Amigos)": quando há duas pessoas com o mesmo nome, a lista do atalho junta o grupo
    const fichas = gruposDe(m.grupo).flatMap(g => g.fichas.map(f => [f, g]));
    let f = (fichas.find(([f, g]) => norm(`${f.nome} (${g.nome})`) === norm(m.nome)) || fichas.find(([f]) => norm(f.nome) === norm(m.nome)) || [])[0];
    if (m.grupo === 'gastos') {
      const conta = db.contas.find(c => norm(c.nome) === norm(m.nome));
      if (conta) descontar(conta, m.valor, m.data); else semConta.add(m.nome);
      // o item em Gastos tem o nome da conta, escrito como está em Contas
      if (!f) grupoChamado('Dia a dia', 'gastos').fichas.push(f = { id: uid(), nome: conta ? conta.nome : m.nome, nota: '', movimentos: [] });
    } else if (!f) {
      grupoChamado('Do atalho', 'dividas').fichas.push(f = { id: uid(), nome: m.nome, nota: '', movimentos: [] });
      nomesNovos++;
    }
    f.movimentos.push({ id: uid(), valor: m.tipo === 'menos' ? -m.valor : m.valor, desc: m.desc, data: m.data });
    db.atalho.push(chave); novos++; ultimo = { m, f };
  }
  if (!novos && !jaVistas && !linhas.some(l => dataAtalho(l))) { desfaz(); toast(deLink ? 'O link do atalho não tem um movimento válido' : 'Este ficheiro não parece ser do atalho'); return; }
  gravarPref('atalho', hoje());
  guardar();
  if (deLink && novos === 1 && !maus) {
    // abre a pessoa ou o item, para se ver logo o movimento novo
    const { m, f } = ultimo;
    irPara(m.grupo); ui.ficha[m.grupo] = f.id; ui.anim = 'entra'; render(); scrollTo(0, 0);
    const valor = m.tipo === 'menos' ? '−' + euro(m.valor) : m.tipo === 'gasto' ? euro(m.valor) + ' gasto' : '+' + euro(m.valor);
    toast(`Guardado: ${f.nome} ${valor}${semConta.size ? ` · sem conta «${m.nome}» em Contas` : ''}`, desfaz);
    return;
  }
  render();
  if (deLink && !novos && jaVistas) { toast('Este movimento já estava guardado'); return; }
  const curta = t => t.length > 40 ? t.slice(0, 39) + '…' : t;
  const naoPercebi = maus ? `não percebi ${maus === 1 ? 'uma linha' : `${maus} linhas`}: «${curta(primeiroMau)}»` : '';
  if (!novos) { toast(naoPercebi ? `Nada de novo · ${naoPercebi}` : 'Não há movimentos novos', maus ? desfaz : null); return; }
  toast([`${novos} ${novos === 1 ? 'movimento importado' : 'movimentos importados'}`,
    nomesNovos ? `${nomesNovos} ${nomesNovos === 1 ? 'pessoa nova' : 'pessoas novas'} em «Do atalho»` : '',
    semConta.size ? `sem conta «${[...semConta].join('», «')}» em Contas` : '',
    semData ? `${semData} sem data (ficou a de hoje)` : '',
    naoPercebi].filter(Boolean).join(' · '), desfaz);
}

/** Os nomes que o atalho mostra: as pessoas das dívidas ou as contas. Um por linha, para colar numa ação Texto. */
function nomesAtalho(tipo) {
  if (tipo === 'contas') return [...new Set(db.contas.map(c => c.nome))];
  const fs = gruposDe('dividas').flatMap(g => g.fichas.map(f => [f.nome, g.nome]));
  const repetido = n => fs.filter(([x]) => norm(x) === norm(n)).length > 1;
  return [...new Set(fs.map(([n, g]) => repetido(n) ? `${n} (${g})` : n))];
}
