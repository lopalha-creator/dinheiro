<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dinheiro">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Dinheiro</title>
<style>
:root {
  --bg: #f2f2f7; --cel: #fff; --sep: rgba(60,60,67,.2); --txt: #000;
  --sec: rgba(60,60,67,.6); --ter: rgba(60,60,67,.3);
  --acc: #1a8f4c; --verde: #248a3d; --verm: #d70015;
  --fill: rgba(118,118,128,.12); --seg-on: #fff; --prem: rgba(0,0,0,.06);
  --barra: rgba(249,249,249,.86); --acoes: rgba(255,255,255,.92);
  /* cores dos gráficos de distribuição, por esta ordem (validadas para daltonismo em claro e escuro) */
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948; --c0: #8e8e93;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000; --cel: #1c1c1e; --sep: rgba(84,84,88,.6); --txt: #fff;
    --sec: rgba(235,235,245,.6); --ter: rgba(235,235,245,.3);
    --acc: #30d158; --verde: #30d158; --verm: #ff453a;
    --fill: rgba(118,118,128,.24); --seg-on: #636366; --prem: rgba(255,255,255,.08);
    --barra: rgba(22,22,24,.86); --acoes: rgba(44,44,46,.94);
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --c0: #636366;
  }
}
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
html.travado { overflow: hidden; }
body {
  background: var(--bg); color: var(--txt);
  font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; min-height: 100vh;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
input, textarea { font: inherit; color: inherit; background: none; border: 0; outline: 0; width: 100%; min-width: 0; }
svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.pagina { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 4px) 16px calc(100px + env(safe-area-inset-bottom)); }
.barra { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
.acoes { display: flex; gap: 4px; align-items: center; }
.icbtn { width: 40px; height: 40px; display: grid; place-items: center; color: var(--acc); border-radius: 20px; }
.icbtn svg { width: 24px; height: 24px; }
.icbtn.peq { width: 30px; height: 30px; }
.icbtn.peq svg { width: 20px; height: 20px; }
.txtbtn { color: var(--acc); padding: 8px 6px; }
.forte { font-weight: 600; }
.voltar { display: flex; align-items: center; color: var(--acc); margin-left: -8px; padding: 8px 0; }
.voltar svg { width: 24px; height: 24px; stroke-width: 2.2; }
h1 { font-size: 34px; font-weight: 700; margin: 2px 0 14px; overflow-wrap: anywhere; }

.lista { background: var(--cel); border-radius: 12px; overflow: hidden; margin-bottom: 22px; }
.lista > * { position: relative; }
.lista > * + *::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
.linha { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 10px 16px; }
button.linha:active, .grupo-acoes button:active, .cancelar-acoes:active { background: var(--prem); }
.txt { flex: 1; min-width: 0; }
.sub { font-size: 13px; color: var(--sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.val { font-variant-numeric: tabular-nums; white-space: nowrap; }
.sec { color: var(--sec); }
.ter { color: var(--ter); }
.pos { color: var(--verde); }
.neg { color: var(--verm); }
.zero { color: var(--sec); }
.chev { width: 14px; height: 14px; color: var(--ter); stroke-width: 2.6; flex: none; margin-right: -4px; }
.acao { color: var(--acc); }
.acao svg { width: 22px; height: 22px; flex: none; }
.perigo { color: var(--verm) !important; }

.cab-sec { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--sec); padding: 0 6px 6px 16px; margin-top: -4px; min-height: 30px; }
.cab-sec > span:first-child { text-transform: uppercase; }
.cab-sec .dir { display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.cartao-total { padding: 16px; }
.rot { font-size: 15px; color: var(--sec); }
.grande { font: 700 40px/1.15 ui-rounded, -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; margin: 2px 0; overflow-wrap: anywhere; }
.leg { font-size: 13px; color: var(--sec); }
.rodape { font-size: 13px; color: var(--sec); padding: 0 16px; margin: -14px 0 22px; }
.total-rodape { display: flex; justify-content: space-between; font-weight: 600; padding: 0 16px; margin-top: -12px; font-variant-numeric: tabular-nums; }
.mini { width: 38px; height: 32px; border-radius: 8px; background: var(--fill); color: var(--acc); text-align: center; font-size: 17px; }
.mini:disabled { opacity: .3; }
textarea.nota { display: block; padding: 12px 16px; resize: none; min-height: 46px; }
.ponto { width: 10px; height: 10px; border-radius: 3px; flex: none; }

/* gráficos */
.graf { position: relative; margin-top: 14px; touch-action: pan-y; -webkit-user-select: none; user-select: none; outline: 0; border-radius: 6px; }
.graf:focus-visible { box-shadow: 0 0 0 2px var(--acc); }
.graf svg { display: block; overflow: visible; stroke: none; }
.graf text { fill: var(--sec); font-size: 11px; font-variant-numeric: tabular-nums; }
.graf .grelha { stroke: var(--sep); stroke-width: 1; }
.graf .eixo0 { stroke: var(--ter); stroke-width: 1; }
.graf .traco { fill: none; stroke: var(--acc); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.graf .area { fill: var(--acc); opacity: .12; }
.graf .marca { fill: var(--acc); stroke: var(--cel); stroke-width: 2; }
.graf .mira, .graf .cursor { visibility: hidden; }
.graf .mira { stroke: var(--sec); stroke-width: 1; }
.graf.ativo .mira, .graf.ativo .cursor { visibility: visible; }
.graf .coluna { fill: var(--acc); transition: opacity .15s; }
.graf.ativo .coluna:not(.on) { opacity: .35; }
.seg.peq { margin: 14px 0 0; }
.seg.peq button { font-size: 13px; padding: 5px 2px; }
.comp-bloco { padding: 16px; }
.comp { display: flex; gap: 2px; height: 12px; border-radius: 4px; overflow: hidden; }
.comp span { min-width: 3px; }

/* ocultar valores (para mostrar o ecrã a alguém) */
.oculto :is(.val, .grande, .leg, .sub, .graf text, .cab-sec .dir, .total-rodape) { filter: blur(8px); }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center;
  padding: 6px 8px calc(env(safe-area-inset-bottom) + 6px);
  background: var(--barra); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--sep);
}
.tabs button { flex: 1; max-width: 130px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 500; color: var(--sec); padding: 2px 0; }
.tabs svg { width: 26px; height: 26px; }
.tabs .on { color: var(--acc); }

.entra { animation: entra .3s cubic-bezier(.2,.8,.2,1); }
.volta { animation: volta .3s cubic-bezier(.2,.8,.2,1); }
@keyframes entra { from { transform: translateX(28%); opacity: 0; } }
@keyframes volta { from { transform: translateX(-18%); opacity: 0; } }

#camada .fundo { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.38); animation: aparece .25s; }
.folha {
  position: fixed; left: 0; right: 0; bottom: 0; top: calc(env(safe-area-inset-top) + 12px); z-index: 11;
  max-width: 640px; margin: 0 auto; background: var(--bg); border-radius: 14px 14px 0 0;
  display: flex; flex-direction: column; animation: sobe .34s cubic-bezier(.2,.8,.2,1);
}
.folha-barra { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; min-height: 54px; }
.folha-barra strong { flex: 1; text-align: center; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.folha-corpo { flex: 1; overflow: auto; padding: 8px 16px 40px; }
.campo-val span { color: var(--sec); font-size: 20px; }
.valor-grande { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
input[type=date] { width: auto; text-align: right; color: var(--acc); }
.seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin-bottom: 16px; }
.seg button { flex: 1; text-align: center; padding: 8px 4px; border-radius: 7px; font-size: 15px; font-weight: 500; }
.seg .on { background: var(--seg-on); box-shadow: 0 1px 4px rgba(0,0,0,.14); }
.interruptor { appearance: none; -webkit-appearance: none; flex: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill); position: relative; transition: background .2s; }
.interruptor::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.22); transition: transform .2s; }
.interruptor:checked { background: #34c759; }
.interruptor:checked::after { transform: translateX(20px); }

.folha-acoes { position: fixed; left: 8px; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 8px); z-index: 11; max-width: 480px; margin: 0 auto; animation: sobe .3s cubic-bezier(.2,.8,.2,1); }
.grupo-acoes { background: var(--acoes); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 14px; overflow: hidden; margin-bottom: 8px; }
.grupo-acoes > * + * { border-top: .5px solid var(--sep); }
.grupo-acoes button, .cancelar-acoes { display: block; width: 100%; text-align: center; padding: 17px; font-size: 19px; color: var(--acc); }
.titulo-acoes { font-size: 13px; color: var(--sec); text-align: center; padding: 14px 16px; }
.cancelar-acoes { background: var(--cel); border-radius: 14px; font-weight: 600; }
#camada.saindo .folha, #camada.saindo .folha-acoes { animation: desce .25s forwards; }
#camada.saindo .fundo { animation: some .25s forwards; }
@keyframes sobe { from { transform: translateY(100%); } }
@keyframes desce { to { transform: translateY(110%); } }
@keyframes aparece { from { opacity: 0; } }
@keyframes some { to { opacity: 0; } }
.abanar { animation: abanar .3s; }
@keyframes abanar { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

#toast {
  position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 20;
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: .25s;
  background: rgba(0,0,0,.82); color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 15px;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toast.com-acao { pointer-events: auto; white-space: nowrap; }
#toast button { color: #30d158; font-weight: 600; margin-left: 12px; padding: 4px 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="camada"></div>
<div id="toast" role="status"></div>
<script>
'use strict';

/* ---------- utilitários ---------- */
const CHAVE = 'dinheiro.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const hoje = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const MESES_LONGOS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
/** "2026-10-08" → "8 out 2026" */
const dataPT = iso => { const [a, m, d] = iso.split('-'); return `${+d} ${MESES[m - 1]} ${a}`; };

// Todos os valores são guardados em cêntimos (inteiros) para não haver erros de arredondamento.
const fmtEuro = new Intl.NumberFormat('pt-PT', { style: 'currency', currency: 'EUR' });
const euro = c => fmtEuro.format(c / 100);
const euroSinal = c => c > 0 ? '+' + euro(c) : c < 0 ? '−' + euro(-c) : euro(0);
const numero = c => {
  const a = Math.abs(c);
  return (a / 100).toLocaleString('pt-PT', { minimumFractionDigits: a % 100 ? 2 : 0, maximumFractionDigits: 2, useGrouping: false });
};
const numSinal = c => (c < 0 ? '-' : '') + numero(c);
const cor = c => c > 0 ? 'pos' : c < 0 ? 'neg' : 'zero';

/** Lê "15,32", "1.044,50", "2 543,49 €" ou somas como "115,82 + 4,60 - 60". Devolve cêntimos ou null. */
function lerValor(texto) {
  let s = String(texto).replace(/−/g, '-').replace(/[^0-9,.+\-]/g, '');
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '');
  s = s.replace(/,/g, '.');
  if (!s) return null;
  const termos = [];
  let atual = '';
  for (const ch of s) {
    if ((ch === '+' || ch === '-') && atual && atual !== '+' && atual !== '-') { termos.push(atual); atual = ch; }
    else atual += ch;
  }
  termos.push(atual);
  let total = 0;
  for (const t of termos) {
    if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(t)) return null;
    total += Math.round(parseFloat(t) * 100);
  }
  return total;
}

/* ---------- dados ---------- */
// Começa vazia. Os dados pessoais entram por "Colar os meus dados" ou por ficheiro, e ficam só no iPhone.
function dadosIniciais() {
  return {
    versao: 2,
    contas: [],
    grupos: [
      { id: uid(), nome: 'Pais', tipo: 'dividas', fichas: [] },
      { id: uid(), nome: 'Amigos', tipo: 'dividas', fichas: [] },
      { id: uid(), nome: 'Viagens', tipo: 'gastos', fichas: [] },
    ],
  };
}

function carregar() {
  try { const s = localStorage.getItem(CHAVE); if (s) return JSON.parse(s); } catch {}
  return null;
}
function guardar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(db)); } catch { toast('Não foi possível guardar'); }
}

/** Cada conta tem um histórico de valores [{ data, valor }] por ordem de data; o valor atual é o último. */
function ordenarHist(c) {
  c.hist.sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0);
  c.valor = c.hist[c.hist.length - 1].valor;
}
/** Acrescenta a dados antigos o que as versões novas precisam (o histórico das contas começa hoje). */
function migrar(d) {
  for (const c of d.contas) {
    if (!Array.isArray(c.hist) || !c.hist.length) c.hist = [{ data: hoje(), valor: c.valor }];
    ordenarHist(c);
  }
  d.versao = 2;
  return d;
}

let db = carregar();
db = db ? migrar(db) : dadosIniciais();
guardar();

const totalFicha = f => f.movimentos.reduce((s, m) => s + m.valor, 0);
const totalGrupo = g => g.fichas.reduce((s, f) => s + totalFicha(f), 0);
const gruposDe = tipo => db.grupos.filter(g => g.tipo === tipo);
const totalContas = () => db.contas.filter(c => c.noTotal).reduce((s, c) => s + c.valor, 0);
const totalDividas = () => gruposDe('dividas').reduce((s, g) => s + totalGrupo(g), 0);
const movOrdenados = f => f.movimentos
  .map((m, i) => [m, i])
  .sort((a, b) => a[0].data < b[0].data ? -1 : a[0].data > b[0].data ? 1 : a[1] - b[1])
  .map(x => x[0]);
/** A conta escrita como na nota: "115,82 tricount + 4,60 pré casa − 2,50 fino ibar" */
const expressao = f => movOrdenados(f)
  .map((m, i) => (m.valor < 0 ? '− ' : i ? '+ ' : '') + numero(m.valor) + (m.desc ? ' ' + m.desc : ''))
  .join(' ');
function acharFicha(id) {
  for (const g of db.grupos) { const f = g.fichas.find(f => f.id === id); if (f) return [g, f]; }
  return [null, null];
}
function mover(lista, id, d) {
  const i = lista.findIndex(x => x.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= lista.length) return;
  [lista[i], lista[j]] = [lista[j], lista[i]];
}

/* ---------- ícones ---------- */
const ic = {
  resumo: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M15.6 8.7a4.3 4.3 0 1 0 0 6.6M7.6 10.9h6.2M7.6 13.3h6.2"/></svg>',
  contas: '<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.6v4.8M18 9.6v4.8"/></svg>',
  dividas: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.2c.6-3.3 3-5.1 6-5.1s5.4 1.8 6 5.1"/><circle cx="16.6" cy="9" r="2.6"/><path d="M16.8 13.7c2.3 0 4 1.4 4.5 4"/></svg>',
  gastos: '<svg viewBox="0 0 24 24"><path d="M2.5 4h2.6l2.3 10.6h10.4l2-7.6H6.3"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  voltar: '<svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg>',
  mais: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  maisCirc: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 8v8M8 12h8"/></svg>',
  opcoes: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M7.9 12h.01M12 12h.01M16.1 12h.01" stroke-width="2.6"/></svg>',
  pasta: '<svg viewBox="0 0 24 24"><path d="M3 7v11a1.5 1.5 0 0 0 1.5 1.5h15A1.5 1.5 0 0 0 21 18V9a1.5 1.5 0 0 0-1.5-1.5H12L10 5H4.5A1.5 1.5 0 0 0 3 6.5z"/><path d="M12 10.5v6M9 13.5h6"/></svg>',
  certo: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M8 12.3l2.7 2.7L16 9.6"/></svg>',
  olho: '<svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  olhoFechado: '<svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>',
};

/* ---------- estado do ecrã ---------- */
const lerPref = (k, def) => { try { return localStorage.getItem('dinheiro.' + k) ?? def; } catch { return def; } };
const gravarPref = (k, v) => { try { localStorage.setItem('dinheiro.' + k, v); } catch {} };
const ui = {
  tab: lerPref('tab', 'resumo'),
  ficha: { contas: null, dividas: null, gastos: null }, // conta ou ficha aberta em cada separador
  scroll: {},
  ordenar: false,
  anim: '',
  periodo: lerPref('periodo', 'Tudo'),
  oculto: lerPref('oculto', '') === '1',
};
let camada = null; // folha ou menu aberto

/* ---------- séries no tempo ---------- */
// Nos gráficos os dias são inteiros (dias desde 1970), para as contas com datas serem simples.
const DIA = 864e5;
const diaDe = iso => Math.round(Date.parse(iso + 'T00:00Z') / DIA);
const isoDe = n => new Date(n * DIA).toISOString().slice(0, 10);
const PERIODOS = [['1M', 'no último mês', 30], ['3M', 'nos últimos 3 meses', 91], ['1A', 'no último ano', 365], ['Tudo', '', Infinity]];
const fmtCompacto = new Intl.NumberFormat('pt-PT', { notation: 'compact', maximumFractionDigits: 1 });
const fmtPct = new Intl.NumberFormat('pt-PT', { style: 'percent', maximumFractionDigits: 1 });

/** Junta variações [dia, delta] numa série em escada [dia, valor], com um ponto por dia em que houve mudança. */
function acumular(eventos) {
  const pts = [];
  let total = 0;
  for (const [d, v] of [...eventos].sort((a, b) => a[0] - b[0])) {
    total += v;
    if (pts.length && pts[pts.length - 1][0] === d) pts[pts.length - 1][1] = total; else pts.push([d, total]);
  }
  return pts;
}
function valorEm(pts, d) {
  let v = 0;
  for (const p of pts) { if (p[0] > d) break; v = p[1]; }
  return v;
}
/** Os pontos entre os dias "de" e "ate", a começar pelo valor que havia no dia "de". */
const recortar = (pts, de, ate) => [[de, valorEm(pts, de)], ...pts.filter(p => p[0] > de && p[0] <= ate)];

const eventosFicha = f => f.movimentos.map(m => [diaDe(m.data), m.valor]);
const eventosDividas = () => gruposDe('dividas').flatMap(g => g.fichas.flatMap(eventosFicha));
function eventosConta(c) {
  let antes = 0;
  return c.hist.map(h => { const e = [diaDe(h.data), h.valor - antes]; antes = h.valor; return e; });
}
/**
 * Contas no total + dívidas, a partir do primeiro registo de uma conta (antes disso não se sabe o total).
 * Antes do primeiro registo de cada conta conta-se com esse primeiro valor, que é o melhor que se sabe:
 * assim, registar o passado de uma só conta não faz parecer que as outras apareceram do nada.
 */
function serieTotal() {
  const contas = db.contas.filter(c => c.noTotal);
  const inicio = contas.length ? Math.min(...contas.map(c => diaDe(c.hist[0].data))) : null;
  const ev = contas.flatMap(c => eventosConta(c).map((e, i) => i ? e : [inicio, e[1]]));
  const pts = acumular([...ev, ...eventosDividas()]);
  return { pts, inicio: inicio ?? (pts.length ? pts[0][0] : null) };
}

/* ---------- gráficos ---------- */
// Desenhados em SVG à mão (sem bibliotecas, para a app continuar a funcionar sem internet).
// Ao arrastar o dedo, o valor e a data aparecem no cartão por cima, como na app Bolsa.
const graficos = []; // um registo por gráfico no ecrã, refeito a cada render()
const larguraGraf = () => Math.max(200, Math.min(document.documentElement.clientWidth, 640) - 64);
const r1 = n => Math.round(n * 10) / 10;
const rotuloY = c => fmtCompacto.format(c / 100);

function bonito(x) {
  const p = 10 ** Math.floor(Math.log10(x)), f = x / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
/** Limites redondos do eixo vertical e as linhas da grelha (em cêntimos). */
function escala(lo, hi) {
  if (lo > 0 && lo < hi / 2) lo = 0;
  if (hi < 0 && hi > lo / 2) hi = 0;
  if (lo === hi) { lo = Math.min(0, lo); hi = Math.max(0, hi) || 100; }
  const passo = Math.max(1, bonito((hi - lo) / 3));
  lo = Math.floor(lo / passo) * passo; hi = Math.ceil(hi / passo) * passo;
  const linhas = [];
  for (let i = 0; lo + i * passo <= hi; i++) linhas.push(lo + i * passo);
  return { lo, hi, linhas };
}
function grelha(e, pw, W, py, zeroForte) {
  return e.linhas.map(t => {
    const y = r1(py(t));
    return `<line class="${t === 0 && zeroForte ? 'eixo0' : 'grelha'}" x1="0" x2="${r1(pw)}" y1="${y}" y2="${y}"/>` +
      `<text x="${W}" y="${y + 4}" text-anchor="end">${rotuloY(t)}</text>`;
  }).join('');
}
const margemY = e => Math.max(...e.linhas.map(t => rotuloY(t).length)) * 6.5 + 8;
function rotuloDia(d, span) {
  const x = new Date(d * DIA), m = MESES[x.getUTCMonth()];
  return span <= 120 ? `${x.getUTCDate()} ${m}` : span <= 300 ? m : `${m} ${String(x.getUTCFullYear()).slice(2)}`;
}

/** Linha em escada: o valor mantém-se até à mudança seguinte. "pts" começa no dia "de". */
function grafLinha(pts, de, ate, o = {}) {
  const W = larguraGraf(), H = 150, topo = 8;
  const vals = pts.map(p => p[1]);
  const e = escala(Math.min(...vals), Math.max(...vals));
  const pw = W - margemY(e), ph = H - topo, span = ate - de;
  const px = d => (d - de) / span * pw;
  const py = v => topo + (e.hi - v) / (e.hi - e.lo) * ph;
  let traco = `M0 ${r1(py(vals[0]))}`;
  for (let i = 1; i < pts.length; i++) traco += `H${r1(px(pts[i][0]))}V${r1(py(pts[i][1]))}`;
  traco += `H${r1(pw)}`;
  const base = Math.min(e.hi, Math.max(e.lo, 0));
  let svg = grelha(e, pw, W, py, e.lo < 0) +
    `<path class="area" d="${traco}V${r1(py(base))}H0Z"/><path class="traco" d="${traco}"/>`;
  const n = Math.min(pw < 300 ? 3 : 4, span + 1);
  for (let i = 0; i < n; i++) {
    const d = Math.round(de + i * span / (n - 1));
    svg += `<text x="${r1(px(d))}" y="${H + 16}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${rotuloDia(d, span)}</text>`;
  }
  svg += `<line class="mira" x1="0" x2="0" y1="${topo}" y2="${H}"/>` +
    `<circle class="marca" cx="${r1(pw)}" cy="${r1(py(vals[vals.length - 1]))}" r="4"/><circle class="marca cursor" r="4"/>`;
  const i = graficos.push({ tipo: 'linha', pts, de, ate, px, py, pw, cor: !!o.cor }) - 1;
  const desc = `${o.rotulo}: ${euro(vals[0])} em ${dataPT(isoDe(de))}, ${euro(vals[vals.length - 1])} em ${dataPT(isoDe(ate))}`;
  return `<div class="graf" data-g="${i}" tabindex="0" role="img" aria-label="${esc(desc)}"><svg width="${W}" height="${H + 22}" aria-hidden="true">${svg}</svg></div>`;
}

/** Colunas (uma por mês). A ponta é arredondada, a base é direita. */
function grafColunas(barras, o = {}) {
  const W = larguraGraf(), H = 150, topo = 8;
  const vals = barras.map(b => b.valor);
  const e = escala(Math.min(0, ...vals), Math.max(0, ...vals));
  const pw = W - margemY(e), ph = H - topo;
  const banda = pw / barras.length, larg = Math.min(24, banda * .62);
  const py = v => topo + (e.hi - v) / (e.hi - e.lo) * ph, y0 = py(0);
  const salto = Math.ceil(26 / banda); // rótulos de x em meses alternados se não couberem
  let svg = grelha(e, pw, W, py, true);
  barras.forEach((b, i) => {
    const x = i * banda + (banda - larg) / 2, y1 = py(b.valor), h = Math.abs(y1 - y0);
    const r = Math.min(4, larg / 2, h), s = y1 < y0 ? 1 : -1;
    const d = h < .5 ? 'M0 0' : `M${r1(x)} ${r1(y0)}V${r1(y1 + s * r)}Q${r1(x)} ${r1(y1)} ${r1(x + r)} ${r1(y1)}H${r1(x + larg - r)}Q${r1(x + larg)} ${r1(y1)} ${r1(x + larg)} ${r1(y1 + s * r)}V${r1(y0)}Z`;
    svg += `<path class="coluna" d="${d}"/>`;
    if ((barras.length - 1 - i) % salto === 0) svg += `<text x="${r1(x + larg / 2)}" y="${H + 16}" text-anchor="middle">${esc(b.rot)}</text>`;
  });
  const i = graficos.push({ tipo: 'colunas', barras, banda }) - 1;
  const desc = `${o.rotulo}: ` + barras.map(b => `${b.nome} ${euro(b.valor)}`).join(', ');
  return `<div class="graf" data-g="${i}" tabindex="0" role="img" aria-label="${esc(desc)}"><svg width="${W}" height="${H + 22}" aria-hidden="true">${svg}</svg></div>`;
}

/** Mostra no cartão o valor do gráfico na posição x (em píxeis, a partir da esquerda do gráfico). */
function mostrar(el, x) {
  const g = graficos[+el.dataset.g];
  if (!g) return;
  let valor, leg;
  if (g.tipo === 'linha') {
    const d = Math.max(g.de, Math.min(g.ate, Math.round(g.de + x / g.pw * (g.ate - g.de))));
    valor = valorEm(g.pts, d); leg = dataPT(isoDe(d)); g.atual = d;
    el.querySelector('.mira').setAttribute('transform', `translate(${r1(g.px(d))} 0)`);
    const c = el.querySelector('.cursor');
    c.setAttribute('cx', r1(g.px(d))); c.setAttribute('cy', r1(g.py(valor)));
  } else {
    const i = Math.max(0, Math.min(g.barras.length - 1, Math.floor(x / g.banda)));
    valor = g.barras[i].valor; leg = g.barras[i].nome; g.atual = i;
    el.querySelectorAll('.coluna').forEach((c, j) => c.classList.toggle('on', i === j));
  }
  const cartao = el.closest('.cartao-total');
  const v = cartao.querySelector('[data-ler="valor"]'), l = cartao.querySelector('[data-ler="leg"]');
  if (!g.orig) g.orig = [v.innerHTML, v.className, l.innerHTML];
  v.textContent = euro(valor);
  if (g.cor) v.className = 'grande ' + cor(valor);
  l.textContent = leg;
  el.classList.add('ativo');
}
function esconder(el) {
  const g = graficos[+el.dataset.g];
  if (!g?.orig) return;
  const cartao = el.closest('.cartao-total');
  const v = cartao.querySelector('[data-ler="valor"]'), l = cartao.querySelector('[data-ler="leg"]');
  [v.innerHTML, v.className, l.innerHTML] = g.orig;
  g.orig = null; g.atual = null;
  el.classList.remove('ativo');
}
/** Setas do teclado: salta para a mudança (ou coluna) seguinte. */
function passoGraf(el, sentido) {
  const g = graficos[+el.dataset.g];
  if (g.tipo === 'linha') {
    const dias = [...new Set([g.de, ...g.pts.map(p => p[0]), g.ate])];
    const atual = g.atual ?? (sentido > 0 ? g.de - 1 : g.ate + 1);
    const d = sentido > 0 ? dias.find(x => x > atual) : dias.findLast(x => x < atual);
    if (d != null) mostrar(el, g.px(d));
  } else {
    const i = (g.atual ?? (sentido > 0 ? -1 : g.barras.length)) + sentido;
    mostrar(el, (Math.max(0, Math.min(g.barras.length - 1, i)) + .5) * g.banda);
  }
}

/**
 * Evolução até hoje, recortada pelo período escolhido (1M, 3M, 1A, Tudo).
 * Devolve o gráfico com o seletor e a legenda com a variação, ou null se ainda não há história.
 */
function evolucao(pts, inicio, o = {}) {
  if (inicio == null) return null;
  const ate = Math.max(diaDe(hoje()), pts.length ? pts[pts.length - 1][0] : 0);
  const [, texto, dias] = PERIODOS.find(p => p[0] === ui.periodo) || PERIODOS[3];
  const de = Math.max(inicio, ate - dias);
  if (de >= ate) return null;
  const r = recortar(pts, de, ate);
  const v0 = r[0][1], dv = r[r.length - 1][1] - v0;
  const quando = de === ate - dias ? texto : 'desde ' + dataPT(isoDe(de));
  const pct = v0 > 0 && dv ? ` (${fmtPct.format(Math.abs(dv) / v0)})` : '';
  const seta = dv > 0 ? '▲' : dv < 0 ? '▼' : '=';
  return {
    leg: `<span class="${cor(dv)}">${seta} ${euro(Math.abs(dv))}${pct}</span> ${esc(quando)}`,
    graf: grafLinha(r, de, ate, o) + `<div class="seg peq">${PERIODOS.map(([id]) =>
      `<button data-a="periodo" data-id="${id}" class="${ui.periodo === id ? 'on' : ''}">${id}</button>`).join('')}</div>`,
  };
}
/** Evolução de uma pessoa (até hoje) ou de um gasto (do primeiro ao último movimento). */
function grafFicha(f, div) {
  const pts = acumular(eventosFicha(f));
  if (!pts.length) return '';
  const de = pts[0][0], ate = div ? Math.max(diaDe(hoje()), pts[pts.length - 1][0]) : pts[pts.length - 1][0];
  return de < ate ? grafLinha(recortar(pts, de, ate), de, ate, { cor: div, rotulo: div ? 'Saldo ao longo do tempo' : 'Gasto acumulado' }) : '';
}
/** Gastos de todos os grupos, somados por mês (até 12 meses). */
function grafGastosMes() {
  const porMes = new Map();
  for (const g of gruposDe('gastos')) for (const f of g.fichas) for (const m of f.movimentos) {
    const k = m.data.slice(0, 7);
    porMes.set(k, (porMes.get(k) || 0) + m.valor);
  }
  if (!porMes.size) return '';
  const chaves = [...porMes.keys()].sort();
  let [a, m] = chaves[0].split('-').map(Number);
  const [af, mf] = (chaves[chaves.length - 1] > hoje() ? chaves[chaves.length - 1] : hoje().slice(0, 7)).split('-').map(Number);
  const barras = [];
  while (a < af || (a === af && m <= mf)) {
    const k = `${a}-${String(m).padStart(2, '0')}`;
    barras.push({ rot: MESES[m - 1], nome: `${MESES_LONGOS[m - 1]} de ${a}`, valor: porMes.get(k) || 0 });
    if (++m > 12) { m = 1; a++; }
  }
  return barras.length < 2 ? '' : grafColunas(barras.slice(-12), { rotulo: 'Gastos por mês' });
}

/**
 * Barra de distribuição (parte do todo) das partes com valor positivo. As linhas por baixo servem de legenda:
 * cor(i) dá a cor do quadrado de cada linha e pct(i) a percentagem. A cor segue a posição da parte na lista.
 */
function distribuicao(partes) {
  const n = partes.length, corDe = i => n > 8 && i >= 7 ? 'var(--c0)' : `var(--c${i + 1})`;
  const vis = partes.map((p, i) => ({ ...p, i })).filter(p => p.valor > 0);
  if (vis.length < 2) return { barra: '', cor: () => '', pct: () => '' };
  const total = vis.reduce((s, p) => s + p.valor, 0), pct = v => fmtPct.format(v / total);
  const desc = 'Distribuição: ' + vis.map(p => `${p.nome} ${pct(p.valor)}`).join(', ');
  return {
    barra: `<div class="comp-bloco"><div class="comp" role="img" aria-label="${esc(desc)}">${vis.map(p =>
      `<span style="flex:${p.valor} 1 0;background:${corDe(p.i)}" title="${esc(p.nome)}: ${euro(p.valor)} (${pct(p.valor)})"></span>`).join('')}</div></div>`,
    cor: i => partes[i].valor > 0 ? corDe(i) : 'transparent',
    pct: i => partes[i].valor > 0 ? pct(partes[i].valor) : '',
  };
}

/* ---------- vistas ---------- */
function cab(titulo, { voltar = '', acoes = '' } = {}) {
  return `<div class="barra">${voltar ? `<button class="voltar" data-a="voltar">${ic.voltar}${esc(voltar)}</button>` : '<span></span>'}<div class="acoes">${acoes}</div></div><h1>${esc(titulo)}</h1>`;
}
const cabSec = t => `<div class="cab-sec"><span>${esc(t)}</span></div>`;

function linha(titulo, valor, o = {}) {
  const tag = o.a ? 'button' : 'div';
  const attrs = o.a ? ` data-a="${o.a}" data-id="${esc(o.id ?? '')}"` : '';
  const ponto = o.ponto ? `<span class="ponto" style="background:${o.ponto}"></span>` : '';
  return `<${tag} class="linha"${attrs}>${ponto}<div class="txt"><div class="${o.tituloCls || ''}">${esc(titulo)}</div>${o.sub ? `<div class="sub">${esc(o.sub)}</div>` : ''}</div><div class="val ${o.cls || ''}">${valor}</div>${o.a && o.chev !== false ? ic.chev : ''}</${tag}>`;
}
function linhaOrdenar(nome, a, id, i, n) {
  return `<div class="linha"><div class="txt">${esc(nome)}</div>
    <button class="mini" data-a="${a}" data-id="${id}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="Subir">↑</button>
    <button class="mini" data-a="${a}" data-id="${id}" data-d="1" ${i === n - 1 ? 'disabled' : ''} aria-label="Descer">↓</button></div>`;
}
const btnOrdenar = () => `<button class="txtbtn${ui.ordenar ? ' forte' : ''}" data-a="ordenar">${ui.ordenar ? 'OK' : 'Ordenar'}</button>`;

/** Cartão com o valor em grande, uma legenda e o gráfico (que, ao ser tocado, escreve no valor e na legenda). */
function cartao({ rot = '', valor, cls = '', leg = '', graf = '' }) {
  return `<div class="lista"><div class="cartao-total">${rot ? `<div class="rot">${esc(rot)}</div>` : ''}
    <div class="grande ${cls}" data-ler="valor">${valor}</div><div class="leg" data-ler="leg">${leg}</div>${graf}</div></div>`;
}

function textoCopia() {
  const d = lerPref('copia', null);
  if (!d) return '<b>Ainda não guardaste nenhuma cópia de segurança.</b>';
  const n = diaDe(hoje()) - diaDe(d), quando = n <= 0 ? 'hoje' : n === 1 ? 'ontem' : `há ${n} dias`;
  return n > 30 ? `<b>A última cópia de segurança foi ${quando}.</b>` : `Última cópia de segurança: ${quando}.`;
}

function vResumo() {
  const tc = totalContas(), td = totalDividas();
  const fora = db.contas.filter(c => !c.noTotal);
  const gastos = gruposDe('gastos').flatMap(g => g.fichas);
  const vazio = !db.contas.length && db.grupos.every(g => !g.fichas.length);
  const s = serieTotal(), ev = evolucao(s.pts, s.inicio, { rotulo: 'Evolução do total' });
  const leg = ev ? ev.leg : s.inicio != null && !vazio
    ? 'O gráfico da evolução aparece à medida que atualizas as contas.' : 'contas + dívidas a receber';
  const partes = [{ nome: 'Contas', valor: tc, id: 'contas' },
    ...gruposDe('dividas').map(g => ({ nome: 'Dívidas ' + g.nome.toLowerCase(), valor: totalGrupo(g), id: 'dividas' }))];
  const dist = distribuicao(partes);
  const olho = `<button class="icbtn" data-a="ocultar" aria-label="${ui.oculto ? 'Mostrar valores' : 'Ocultar valores'}">${ui.oculto ? ic.olhoFechado : ic.olho}</button>`;
  return cab('Dinheiro', { acoes: olho }) + (vazio ? `<div class="lista">
      <button class="linha acao" data-a="colar">${ic.maisCirc} Colar os meus dados</button>
      <button class="linha acao" data-a="repor">${ic.maisCirc} Importar de um ficheiro</button></div>
    <p class="rodape">Primeira vez? Cola o texto que copiei no teu Mac, ou escolhe o ficheiro <b>dinheiro-dados-iniciais.json</b>.</p>` : '') + `
    ${cartao({ rot: 'Total', valor: euro(tc + td), leg, graf: ev?.graf })}
    <div class="lista">${dist.barra}
      ${partes.map((p, i) => linha(p.nome, euro(p.valor), { a: 'tab', id: p.id, ponto: dist.cor(i), sub: dist.pct(i) })).join('')}
    </div>
    ${fora.length ? cabSec('Fora do total') + `<div class="lista">${fora.map(c => linha(c.nome, euro(c.valor), { cls: 'sec' })).join('')}</div>` : ''}
    ${gastos.length ? cabSec('Gastos') + `<div class="lista">${gastos.map(f => linha(f.nome, euro(totalFicha(f)), { a: 'tab', id: 'gastos' })).join('')}</div>` : ''}
    ${cabSec('Partilhar e cópias')}
    <div class="lista">
      <button class="linha acao" data-a="exportar">Exportar em texto</button>
      <button class="linha acao" data-a="backup">Guardar cópia de segurança</button>
      <button class="linha acao" data-a="repor">Repor cópia de um ficheiro</button>
      <button class="linha acao" data-a="colar">Repor cópia colando texto</button>
    </div>
    <p class="rodape">Os dados ficam só neste iPhone. ${vazio ? '' : textoCopia()} Guarda uma cópia de segurança de vez em quando (por exemplo em Ficheiros → iCloud Drive).</p>`;
}

function vContas() {
  const acoes = btnOrdenar() + `<button class="icbtn" data-a="nova-conta" aria-label="Nova conta">${ic.mais}</button>`;
  const n = db.contas.length, noTotal = db.contas.filter(c => c.noTotal);
  const dist = distribuicao(noTotal);
  const linhas = db.contas.map((c, i) => {
    if (ui.ordenar) return linhaOrdenar(c.nome, 'mover-conta', c.id, i, n);
    const j = noTotal.indexOf(c);
    return linha(c.nome, euro(c.valor), {
      a: 'ficha', id: c.id, cls: c.noTotal ? '' : 'sec',
      ponto: dist.barra && (j < 0 ? 'transparent' : dist.cor(j)),
      sub: [c.nota, j < 0 ? 'fora do total' : dist.pct(j)].filter(Boolean).join(' · '),
    });
  }).join('');
  return cab('Contas', { acoes }) +
    `<div class="lista">${ui.ordenar ? '' : dist.barra}${linhas || '<div class="linha sec">Sem contas</div>'}</div>
     <div class="total-rodape"><span>Total</span><span>${euro(totalContas())}</span></div>`;
}

function vConta() {
  const c = db.contas.find(c => c.id === ui.ficha.contas);
  const acoes = `<button class="icbtn" data-a="menu-conta" aria-label="Opções">${ic.opcoes}</button>
                 <button class="icbtn" data-a="novo-hist" aria-label="Atualizar valor">${ic.mais}</button>`;
  const ev = evolucao(acumular(eventosConta(c)), diaDe(c.hist[0].data), { rotulo: 'Evolução de ' + c.nome });
  let h = cab(c.nome, { voltar: 'Contas', acoes });
  h += cartao({
    rot: [c.nota, c.noTotal ? '' : 'Fora do total'].filter(Boolean).join(' · '), valor: euro(c.valor),
    leg: ev ? ev.leg : 'Atualiza o valor de vez em quando para veres aqui a evolução.', graf: ev?.graf,
  });
  h += cabSec('Histórico') + `<div class="lista">` +
    c.hist.map((x, i) => {
      const dif = i ? x.valor - c.hist[i - 1].valor : null;
      return linha(dataPT(x.data), euro(x.valor), {
        a: 'hist', id: i, chev: false, sub: dif === null ? 'valor inicial' : dif ? euroSinal(dif) : 'sem alteração',
      });
    }).reverse().join('') +
    `<button class="linha acao" data-a="novo-hist">${ic.maisCirc} Atualizar valor</button></div>
    <p class="rodape">Cada vez que atualizas o valor, fica um registo com a data. É daqui que vem o gráfico.</p>`;
  return h;
}

function linhaFicha(f, div) {
  const t = totalFicha(f), tem = f.movimentos.length > 0;
  return linha(f.nome, tem ? euro(t) : '—', {
    a: 'ficha', id: f.id,
    sub: [expressao(f), f.nota].filter(Boolean).join(' · '),
    cls: tem ? (div ? cor(t) : '') : 'ter',
  });
}

function vGrupos(tipo) {
  const div = tipo === 'dividas', gs = gruposDe(tipo);
  const total = gs.reduce((s, g) => s + totalGrupo(g), 0);
  const acoes = btnOrdenar() + `<button class="icbtn" data-a="novo-grupo" aria-label="Novo grupo">${ic.pasta}</button>`;
  let h = cab(div ? 'Dívidas' : 'Gastos', { acoes });
  if (div) {
    const pts = acumular(eventosDividas());
    const ev = evolucao(pts, pts.length ? pts[0][0] : null, { cor: true, rotulo: 'Evolução do que tens a receber' });
    h += cartao({ rot: 'A receber', valor: euro(total), cls: cor(total), leg: ev?.leg, graf: ev?.graf });
  } else {
    const graf = grafGastosMes();
    h += cartao({ rot: 'Total gasto', valor: euro(total), leg: graf ? 'gastos por mês no gráfico' : '', graf });
  }
  for (const g of gs) {
    const n = g.fichas.length;
    h += `<div class="cab-sec"><span>${esc(g.nome)}</span><span class="dir">${euro(totalGrupo(g))}
      <button class="icbtn peq" data-a="menu-grupo" data-id="${g.id}" aria-label="Opções de ${esc(g.nome)}">${ic.opcoes}</button></span></div>`;
    h += `<div class="lista">` +
      g.fichas.map((f, i) => ui.ordenar ? linhaOrdenar(f.nome, 'mover-ficha', f.id, i, n) : linhaFicha(f, div)).join('') +
      `<button class="linha acao" data-a="nova-ficha" data-id="${g.id}">${ic.maisCirc} Adicionar ${div ? 'pessoa' : 'item'}</button></div>`;
  }
  if (!gs.length) h += `<p class="rodape" style="margin-top:0">Ainda não há grupos. Cria um com o botão em cima.</p>`;
  return h;
}

function vFicha(tipo) {
  const [, f] = acharFicha(ui.ficha[tipo]);
  const div = tipo === 'dividas', t = totalFicha(f);
  const legenda = !div ? 'gasto total' : t > 0 ? `${f.nome} deve-te` : t < 0 ? `deves a ${f.nome}` : 'contas saldadas';
  const acoes = `<button class="icbtn" data-a="menu-ficha" aria-label="Opções">${ic.opcoes}</button>
                 <button class="icbtn" data-a="novo-mov" aria-label="Adicionar movimento">${ic.mais}</button>`;
  let h = cab(f.nome, { voltar: div ? 'Dívidas' : 'Gastos', acoes });
  h += cartao({ valor: euro(t), cls: div ? cor(t) : '', leg: esc(legenda), graf: grafFicha(f, div) });
  h += cabSec('Movimentos') + `<div class="lista">` +
    movOrdenados(f).map(m => linha(m.desc || '—', euroSinal(m.valor), {
      a: 'mov', id: m.id, sub: dataPT(m.data), cls: m.valor < 0 ? 'neg' : '', chev: false, tituloCls: m.desc ? '' : 'sec',
    })).join('') +
    `<button class="linha acao" data-a="novo-mov">${ic.maisCirc} Adicionar</button></div>`;
  h += cabSec('Nota') + `<div class="lista"><textarea class="nota" data-campo="nota" rows="2" placeholder="${div ? 'Ex.: deve-me um brasão' : 'Notas'}">${esc(f.nota)}</textarea></div>`;
  if (div && t !== 0) {
    h += `<div class="lista"><button class="linha acao" data-a="saldar">${ic.certo} ${t > 0 ? `Pagou-me tudo (${euro(t)})` : `Paguei tudo (${euro(-t)})`}</button></div>
          <p class="rodape">Acrescenta um movimento que deixa a conta a zero.</p>`;
  }
  return h;
}

function vTabs() {
  const tabs = [['resumo', 'Resumo'], ['contas', 'Contas'], ['dividas', 'Dívidas'], ['gastos', 'Gastos']];
  return `<nav class="tabs">${tabs.map(([id, nome]) =>
    `<button data-a="tab" data-id="${id}" class="${ui.tab === id ? 'on' : ''}">${ic[id]}<span>${nome}</span></button>`).join('')}</nav>`;
}

function render() {
  const t = ui.tab;
  let html;
  graficos.length = 0;
  if (t === 'resumo') html = vResumo();
  else if (t === 'contas') {
    if (!db.contas.some(c => c.id === ui.ficha.contas)) ui.ficha.contas = null;
    html = ui.ficha.contas ? vConta() : vContas();
  }
  else if (ui.ficha[t] && acharFicha(ui.ficha[t])[1]) html = vFicha(t);
  else { ui.ficha[t] = null; html = vGrupos(t); }
  $('#app').innerHTML = `<main class="pagina ${ui.anim}">${html}</main>${vTabs()}`;
  ui.anim = '';
}

/* ---------- folhas e menus ---------- */
function abrir(c) {
  camada = c;
  const el = $('#camada');
  el.className = '';
  el.innerHTML = '<div class="fundo" data-a="fechar"></div>' + (c.tipo === 'acoes' ? vAcoes(c) : vFolha(c));
  document.documentElement.classList.add('travado');
  const foco = el.querySelector('[autofocus]');
  if (foco) { foco.focus(); if (foco.value) foco.select(); }
  c.depois?.();
}
function fechar() {
  const aFechar = camada, el = $('#camada');
  if (!aFechar) return;
  el.classList.add('saindo');
  document.activeElement?.blur();
  setTimeout(() => {
    if (camada !== aFechar) return; // entretanto abriu-se outra
    camada = null; el.innerHTML = ''; el.className = '';
    document.documentElement.classList.remove('travado');
  }, 240);
}
function vFolha(c) {
  return `<div class="folha" role="dialog" aria-label="${esc(c.titulo)}">
    <div class="folha-barra"><button class="txtbtn" data-a="fechar">Cancelar</button><strong>${esc(c.titulo)}</strong>
    <button class="txtbtn forte" data-a="guardar-folha">${c.ok || 'Guardar'}</button></div>
    <div class="folha-corpo">${c.corpo}</div></div>`;
}
function vAcoes(c) {
  return `<div class="folha-acoes" role="dialog"><div class="grupo-acoes">
    ${c.titulo ? `<div class="titulo-acoes">${esc(c.titulo)}</div>` : ''}
    ${c.botoes.map((b, i) => `<button data-a="acao" data-id="${i}" class="${b.perigo ? 'perigo' : ''}">${esc(b.texto)}</button>`).join('')}
    </div><button class="cancelar-acoes" data-a="fechar">Cancelar</button></div>`;
}
const acoes = (titulo, botoes) => abrir({ tipo: 'acoes', titulo, botoes });
/** Pede confirmação; depois de feito, o aviso em baixo tem "Desfazer". */
const confirmar = (titulo, texto, fn, desfazer = 'Apagado') => acoes(titulo, [{ texto, perigo: true, fn, desfazer }]);
/** Guarda o estado atual e devolve uma função que o repõe (para o botão "Desfazer"). */
function pontoDeRetorno() {
  const antes = JSON.stringify(db);
  return () => { db = JSON.parse(antes); };
}
function erro(sel) {
  const el = $(sel); el.closest('.lista')?.classList.remove('abanar');
  void el.offsetWidth; el.closest('.lista')?.classList.add('abanar'); el.focus();
  return false;
}

function pedirNome(titulo, valor, ok) {
  abrir({
    tipo: 'folha', titulo, ok: 'OK',
    corpo: `<div class="lista"><div class="linha"><input id="f-nome" placeholder="Nome" value="${esc(valor)}" autocomplete="off" autofocus></div></div>`,
    guardar: () => { const n = $('#f-nome').value.trim(); if (!n) return erro('#f-nome'); ok(n); return true; },
  });
}

// O valor de uma conta que já existe muda-se em "Atualizar valor" (folhaHist), para ficar no histórico.
function folhaConta(id) {
  const c = db.contas.find(c => c.id === id);
  abrir({
    tipo: 'folha', titulo: c ? 'Editar conta' : 'Nova conta',
    corpo: `<div class="lista">
        <div class="linha"><input id="f-nome" placeholder="Nome" value="${esc(c?.nome)}" autocomplete="off" autofocus></div>
        ${c ? '' : '<div class="linha campo-val"><input id="f-valor" class="valor-grande" inputmode="decimal" placeholder="0" autocomplete="off"><span>€</span></div>'}
        <label class="linha"><span class="txt">Contar no total</span><input type="checkbox" class="interruptor" id="f-total" ${!c || c.noTotal ? 'checked' : ''}></label>
        <div class="linha"><input id="f-nota" placeholder="Nota (ex.: interrail)" value="${esc(c?.nota)}" autocomplete="off"></div>
      </div>
      ${c ? `<div class="lista"><button class="linha acao perigo" data-a="apagar-conta" data-id="${c.id}">Apagar conta</button></div>` : ''}`,
    guardar: () => {
      const nome = $('#f-nome').value.trim(), v = c ? c.valor : lerValor($('#f-valor').value);
      if (!nome) return erro('#f-nome');
      if (v === null) return erro('#f-valor');
      let alvo = c;
      if (!alvo) { alvo = { id: uid(), valor: v, hist: [{ data: hoje(), valor: v }] }; db.contas.push(alvo); }
      Object.assign(alvo, { nome, noTotal: $('#f-total').checked, nota: $('#f-nota').value.trim() });
      return true;
    },
  });
}

/** Regista o valor da conta aberta numa data (i = null) ou edita o registo i do histórico. Um registo por dia. */
function folhaHist(i) {
  const c = db.contas.find(c => c.id === ui.ficha.contas), h = i == null ? null : c.hist[i];
  abrir({
    tipo: 'folha', titulo: h ? 'Editar registo' : c.nome,
    corpo: `<div class="lista">
        <div class="linha campo-val"><input id="f-valor" class="valor-grande" inputmode="decimal" placeholder="0" value="${numSinal(h ? h.valor : c.valor)}" autocomplete="off" autofocus><span>€</span></div>
        <label class="linha"><span class="txt">Data</span><input type="date" id="f-data" value="${h?.data || hoje()}"></label>
      </div>
      ${h ? '' : '<p class="rodape">O valor que a conta tem nesta data. Podes escrever contas, como “1200 + 50”.</p>'}
      ${h && c.hist.length > 1 ? `<div class="lista"><button class="linha acao perigo" data-a="apagar-hist" data-id="${i}">Apagar registo</button></div>` : ''}`,
    guardar: () => {
      const v = lerValor($('#f-valor').value), data = $('#f-data').value || hoje();
      if (v === null) return erro('#f-valor');
      let alvo = h || c.hist.find(x => x.data === data);
      if (!alvo) c.hist.push(alvo = {});
      Object.assign(alvo, { data, valor: v });
      c.hist = c.hist.filter(x => x === alvo || x.data !== data);
      ordenarHist(c);
      return true;
    },
  });
}

function folhaMov(movId) {
  const [g, f] = acharFicha(ui.ficha[ui.tab]);
  const m = f.movimentos.find(m => m.id === movId), div = g.tipo === 'dividas';
  const neg = m ? m.valor < 0 : false;
  abrir({
    tipo: 'folha', titulo: m ? 'Editar' : f.nome, sinal: neg, nome: f.nome, div,
    corpo: `<div class="seg" id="f-sinal">
        <button data-a="sinal" data-id="0" class="${neg ? '' : 'on'}">${div ? 'Deve-me  +' : 'Gasto  +'}</button>
        <button data-a="sinal" data-id="1" class="${neg ? 'on' : ''}">${div ? 'Desconto  −' : 'Reembolso  −'}</button>
      </div>
      <div class="lista">
        <div class="linha campo-val"><input id="f-valor" class="valor-grande" inputmode="decimal" placeholder="0,00" value="${m ? numero(m.valor) : ''}" autocomplete="off" autofocus><span>€</span></div>
        <div class="linha"><input id="f-desc" placeholder="${div ? 'Descrição (ex.: jogo padle)' : 'Descrição'}" value="${esc(m?.desc)}" autocomplete="off"></div>
        <label class="linha"><span class="txt">Data</span><input type="date" id="f-data" value="${m?.data || hoje()}"></label>
      </div>
      ${div ? '<p class="rodape" id="f-ajuda"></p>' : ''}
      ${m ? `<div class="lista"><button class="linha acao perigo" data-a="apagar-mov" data-id="${m.id}">Apagar movimento</button></div>` : ''}`,
    depois: ajudaSinal,
    guardar: () => {
      const v = lerValor($('#f-valor').value);
      if (v === null) return erro('#f-valor');
      const dados = { valor: camada.sinal ? -Math.abs(v) : v, desc: $('#f-desc').value.trim(), data: $('#f-data').value || hoje() };
      if (m) Object.assign(m, dados); else f.movimentos.push({ id: uid(), ...dados });
      return true;
    },
  });
}
function ajudaSinal() {
  const el = $('#f-ajuda');
  if (el) el.textContent = camada.sinal
    ? `Desconta ao que ${camada.nome} te deve (pagou-te, ou pagou algo por ti).`
    : `Soma ao que ${camada.nome} te deve.`;
}

/* ---------- exportar e cópias ---------- */
function textoExportar() {
  const L = ['Dinheiro — ' + new Date().toLocaleDateString('pt-PT', { day: 'numeric', month: 'long', year: 'numeric' }), ''];
  for (const c of db.contas) L.push(`${c.nome}: ${numSinal(c.valor)}${c.nota ? ` (${c.nota})` : ''}${c.noTotal ? '' : ' [fora do total]'}`);
  const tc = totalContas(), td = totalDividas();
  L.push(`Total contas: ${euro(tc)}`);
  for (const g of db.grupos) {
    L.push('', (g.tipo === 'dividas' ? 'DÍVIDAS ' : 'GASTOS ') + g.nome.toUpperCase());
    for (const f of g.fichas) {
      let l = `${f.nome}:`;
      if (f.movimentos.length) { l += ' ' + expressao(f); if (f.movimentos.length > 1) l += ' = ' + numSinal(totalFicha(f)); }
      if (f.nota) l += ` (${f.nota})`;
      L.push(l);
    }
    L.push(`Total ${g.nome.toLowerCase()}: ${euro(totalGrupo(g))}`);
  }
  L.push('', `TOTAL: ${euro(tc)} + ${euro(td)} = ${euro(tc + td)}`);
  return L.join('\n');
}
async function exportar() {
  const t = textoExportar();
  if (navigator.share) { try { await navigator.share({ text: t }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(t); toast('Texto copiado'); } catch { toast('Não foi possível copiar'); }
}
async function backup() {
  const nome = `dinheiro-${hoje()}.json`;
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const ficheiro = new File([blob], nome, { type: 'application/json' });
  const feito = () => { gravarPref('copia', hoje()); render(); };
  if (navigator.canShare?.({ files: [ficheiro] })) {
    try { await navigator.share({ files: [ficheiro] }); feito(); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  feito();
}
function importar(texto) {
  try {
    const d = JSON.parse(String(texto).trim());
    if (!Array.isArray(d.contas) || !Array.isArray(d.grupos) || !d.contas.every(c => Number.isFinite(c.valor)) ||
        !d.grupos.every(g => Array.isArray(g.fichas) && g.fichas.every(f => Array.isArray(f.movimentos)))) throw new Error();
    confirmar('Substituir todos os dados atuais por estes?', 'Substituir', () => {
      db = migrar(d); ui.ficha = { contas: null, dividas: null, gastos: null };
    }, 'Dados importados');
    return true;
  } catch {
    toast('Estes dados não são válidos');
    return false;
  }
}
function repor() {
  // Sem filtro de tipo: no iPhone o filtro .json costuma deixar os ficheiros a cinzento.
  const i = document.createElement('input');
  i.type = 'file'; i.style.display = 'none';
  document.body.appendChild(i);
  i.onchange = async () => {
    const f = i.files[0]; i.remove();
    if (f) importar(await f.text());
  };
  i.click();
}
function colar() {
  abrir({
    tipo: 'folha', titulo: 'Colar dados', ok: 'Importar',
    corpo: `<div class="lista"><textarea id="f-dados" class="nota" rows="8" placeholder="Toca aqui, mantém o dedo e escolhe Colar" autocomplete="off" autocorrect="off" spellcheck="false"></textarea></div>
      <p class="rodape" style="margin-top:-14px">Copia o texto da cópia de segurança (por exemplo, no Mac) e cola-o aqui.</p>`,
    guardar: () => {
      const t = $('#f-dados').value;
      if (!t.trim()) return erro('#f-dados');
      camada = null; $('#camada').innerHTML = ''; document.documentElement.classList.remove('travado');
      importar(t);
      return false;
    },
  });
}
/** Aviso curto em baixo. Com "desfazer" (uma função), fica mais tempo e tem o botão Desfazer. */
function toast(t, desfazer) {
  const el = $('#toast');
  el.innerHTML = esc(t) + (desfazer ? '<button data-a="desfazer">Desfazer</button>' : '');
  el.classList.toggle('com-acao', !!desfazer);
  el.classList.add('on');
  toast.desfazer = desfazer;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { el.classList.remove('on', 'com-acao'); toast.desfazer = null; }, desfazer ? 5000 : 1800);
}

/* ---------- ações ---------- */
function irPara(tab) {
  gravarPref('tab', tab);
  ui.tab = tab; ui.ordenar = false;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const a = b.dataset.a, id = b.dataset.id;
  const naFicha = () => acharFicha(ui.ficha[ui.tab]);

  switch (a) {
    case 'tab':
      if (id === ui.tab && ui.ficha[id]) { ui.ficha[id] = null; ui.anim = 'volta'; }
      else if (id === ui.tab) { scrollTo({ top: 0, behavior: 'smooth' }); return; }
      else irPara(id);
      render(); scrollTo(0, 0); return;
    case 'voltar':
      ui.ficha[ui.tab] = null; ui.anim = 'volta';
      render(); scrollTo(0, ui.scroll[ui.tab] || 0); return;
    case 'ficha':
      ui.scroll[ui.tab] = scrollY; ui.ficha[ui.tab] = id; ui.anim = 'entra';
      render(); scrollTo(0, 0); return;
    case 'ordenar': ui.ordenar = !ui.ordenar; render(); return;
    case 'mover-conta': mover(db.contas, id, +b.dataset.d); break;
    case 'mover-ficha': { const g = db.grupos.find(g => g.fichas.some(f => f.id === id)); if (g) mover(g.fichas, id, +b.dataset.d); break; }

    case 'nova-conta': folhaConta(null); return;
    case 'menu-conta': {
      const c = db.contas.find(c => c.id === ui.ficha.contas);
      acoes(c.nome, [
        { texto: 'Editar conta', fn: () => folhaConta(c.id) },
        { texto: 'Apagar conta', perigo: true, fn: () => confirmar(`Apagar a conta "${c.nome}" e o seu histórico?`, 'Apagar', () => { db.contas = db.contas.filter(x => x !== c); }) },
      ]);
      return;
    }
    case 'novo-hist': folhaHist(null); return;
    case 'hist': folhaHist(+id); return;
    case 'apagar-hist': {
      const c = db.contas.find(c => c.id === ui.ficha.contas), desfaz = pontoDeRetorno();
      c.hist.splice(+id, 1); ordenarHist(c);
      guardar(); fechar(); render(); toast('Registo apagado', desfaz); return;
    }
    case 'apagar-conta': {
      const c = db.contas.find(c => c.id === id);
      confirmar(`Apagar a conta "${c.nome}"?`, 'Apagar', () => { db.contas = db.contas.filter(x => x !== c); });
      return;
    }

    case 'novo-grupo':
      pedirNome('Novo grupo', '', n => db.grupos.push({ id: uid(), nome: n, tipo: ui.tab, fichas: [] }));
      return;
    case 'nova-ficha': {
      const g = db.grupos.find(g => g.id === id);
      pedirNome(ui.tab === 'dividas' ? `Nova pessoa em ${g.nome}` : `Novo item em ${g.nome}`, '',
        n => g.fichas.push({ id: uid(), nome: n, nota: '', movimentos: [] }));
      return;
    }
    case 'menu-grupo': {
      const g = db.grupos.find(g => g.id === id);
      acoes(g.nome, [
        { texto: 'Mudar nome', fn: () => pedirNome('Mudar nome', g.nome, n => { g.nome = n; }) },
        { texto: 'Apagar grupo', perigo: true, fn: () => confirmar(`Apagar "${g.nome}" e tudo o que tem dentro?`, 'Apagar', () => { db.grupos = db.grupos.filter(x => x !== g); }) },
      ]);
      return;
    }
    case 'menu-ficha': {
      const [g, f] = naFicha();
      const botoes = [{ texto: 'Mudar nome', fn: () => pedirNome('Mudar nome', f.nome, n => { f.nome = n; }) }];
      if (f.movimentos.length) botoes.push({ texto: 'Apagar todos os movimentos', perigo: true,
        fn: () => confirmar(`Apagar todos os movimentos de ${f.nome}?`, 'Apagar', () => { f.movimentos = []; }) });
      botoes.push({ texto: g.tipo === 'dividas' ? 'Apagar pessoa' : 'Apagar item', perigo: true,
        fn: () => confirmar(`Apagar ${f.nome} e os seus movimentos?`, 'Apagar', () => { g.fichas = g.fichas.filter(x => x !== f); ui.ficha[ui.tab] = null; }) });
      acoes(f.nome, botoes);
      return;
    }

    case 'novo-mov': folhaMov(null); return;
    case 'mov': folhaMov(id); return;
    case 'apagar-mov': {
      const [, f] = naFicha(), desfaz = pontoDeRetorno();
      f.movimentos = f.movimentos.filter(m => m.id !== id);
      guardar(); fechar(); render(); toast('Movimento apagado', desfaz); return;
    }
    case 'sinal':
      camada.sinal = id === '1';
      document.querySelectorAll('#f-sinal button').forEach(x => x.classList.toggle('on', x.dataset.id === id));
      ajudaSinal(); return;
    case 'saldar': {
      const [, f] = naFicha(), t = totalFicha(f), desfaz = pontoDeRetorno();
      f.movimentos.push({ id: uid(), valor: -t, desc: t > 0 ? 'pagou' : 'paguei', data: hoje() });
      toast('Conta saldada', desfaz);
      break;
    }

    case 'fechar': fechar(); return;
    case 'guardar-folha': if (camada?.guardar() === true) { guardar(); fechar(); render(); } return;
    case 'acao': {
      const botao = camada.botoes[+id], desfaz = botao.desfazer && pontoDeRetorno();
      camada = null; $('#camada').innerHTML = ''; document.documentElement.classList.remove('travado');
      botao.fn(); guardar(); render();
      if (desfaz) toast(botao.desfazer, desfaz);
      return;
    }
    case 'desfazer':
      if (!toast.desfazer) return;
      toast.desfazer(); toast('Desfeito');
      break;

    case 'periodo': ui.periodo = id; gravarPref('periodo', id); render(); return;
    case 'ocultar':
      ui.oculto = !ui.oculto; gravarPref('oculto', ui.oculto ? '1' : '');
      document.documentElement.classList.toggle('oculto', ui.oculto);
      render(); return;

    case 'exportar': exportar(); return;
    case 'backup': backup(); return;
    case 'repor': repor(); return;
    case 'colar': colar(); return;
    default: return;
  }
  guardar(); render();
});

// Os botões do seletor +/− não tiram o foco ao campo do valor (o teclado não fecha).
document.addEventListener('mousedown', e => { if (e.target.closest('.seg')) e.preventDefault(); });

document.addEventListener('input', e => {
  if (e.target.dataset.campo !== 'nota') return;
  const [, f] = acharFicha(ui.ficha[ui.tab]);
  if (f) { f.nota = e.target.value; guardar(); }
});

document.addEventListener('keydown', e => {
  const graf = e.target.closest?.('.graf');
  if (graf && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); passoGraf(graf, e.key === 'ArrowRight' ? 1 : -1); return; }
  if (!camada) return;
  if (e.key === 'Escape') fechar();
  if (e.key === 'Enter' && camada.guardar && e.target.matches('#camada input')) {
    e.preventDefault(); $('[data-a="guardar-folha"]').click();
  }
});

// Gráficos: arrastar o dedo (ou passar o rato) mostra o valor em cada data.
const grafEm = e => e.target.closest?.('.graf');
const mostrarEm = (el, e) => mostrar(el, e.clientX - el.getBoundingClientRect().left);
document.addEventListener('pointerdown', e => { const el = grafEm(e); if (el) mostrarEm(el, e); });
document.addEventListener('pointermove', e => { const el = grafEm(e); if (el) mostrarEm(el, e); });
document.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') document.querySelectorAll('.graf.ativo').forEach(esconder); });
document.addEventListener('pointercancel', () => document.querySelectorAll('.graf.ativo').forEach(esconder));
document.addEventListener('pointerout', e => { const el = grafEm(e); if (el && e.pointerType === 'mouse' && !el.contains(e.relatedTarget)) esconder(el); });
document.addEventListener('focusout', e => { if (e.target.matches?.('.graf')) esconder(e.target); });

// Ao rodar o iPhone (ou mudar a largura da janela), os gráficos são redesenhados com a nova largura.
let larguraAntes = innerWidth;
addEventListener('resize', () => { if (innerWidth !== larguraAntes) { larguraAntes = innerWidth; render(); } });

document.documentElement.classList.toggle('oculto', ui.oculto);
render();
navigator.storage?.persist?.();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
