/** Os nomes que o atalho mostra: as pessoas das dívidas ou as contas. Um por linha, para colar numa ação Texto. */
function nomesAtalho(tipo) {
  if (tipo === 'contas') return [...new Set(db.contas.map(c => c.nome))];
  const fs = gruposDe('dividas').flatMap(g => g.fichas.map(f => [f.nome, g.nome]));
  const repetido = n => fs.filter(([x]) => norm(x) === norm(n)).length > 1;
  return [...new Set(fs.map(([n, g]) => repetido(n) ? `${n} (${g})` : n))];
}

const URL_ATALHO = 'https://raw.githubusercontent.com/lopalha-creator/dinheiro/main/atalho/Dinheiro.shortcut';
const COMANDO_MAC = `cd ~/Downloads && curl -fsSL -o Dinheiro.shortcut ${URL_ATALHO} && shortcuts sign -m anyone -i Dinheiro.shortcut -o Dinheiro-assinado.shortcut && open Dinheiro-assinado.shortcut`;

/** A cópia de segurança faz falta: nunca houve, ou a última tem mais de 30 dias (e já há dados). */
function faltaCopia() {
  if (!db.contas.length && db.grupos.every(g => !g.fichas.length)) return false;
  const d = lerPref('copia', null);
  return !d || diaDe(hoje()) - diaDe(d) > 30;
}

/** Separador Definições: o tema, o atalho do iPhone e as cópias de segurança. */
function vDefinicoes() {
  const ult = lerPref('atalho', ''), n = /^\d{4}-/.test(ult) ? diaDe(hoje()) - diaDe(ult) : null;
  const quando = n === null ? 'ainda nenhuma' : n <= 0 ? 'hoje' : n === 1 ? 'ontem' : `há ${n} dias`;
  const np = nomesAtalho('dividas').length, tema = lerPref('tema', '');
  const opcao = (a, icone, texto, det = '', id = '') => `<button class="linha opcao" data-a="${a}"${id ? ` data-id="${id}"` : ''}>${avatarIcone(icone)}` +
    `<span class="txt">${esc(texto)}${det ? `<span class="det">${esc(det)}</span>` : ''}</span></button>`;
  return `<div class="cab-tab"><h1>Definições</h1></div>
    <section class="cartao">${cabCartao('Tema')}
      <div class="seg tema">${[['', 'Automático'], ['claro', 'Claro'], ['escuro', 'Escuro']].map(([id, nome]) =>
        `<button data-a="tema" data-id="${id}" class="${tema === id ? 'on' : ''}">${nome}</button>`).join('')}</div></section>
    <section class="cartao">${cabCartao('Cópia de segurança')}<p class="texto">${textoCopia()}</p>
      ${opcao('backup', ic.guardar, 'Guardar cópia de segurança')}
      ${opcao('exportar', ic.partilhar, 'Exportar em texto')}
      ${opcao('repor', ic.repor, 'Repor de um ficheiro')}
      ${opcao('colar', ic.colar, 'Repor colando texto')}</section>
    <section class="cartao">${cabCartao('Atalho do iPhone')}<p class="texto">Última importação: ${quando}.</p>
      ${opcao('ficheiro-atalho', ic.ficheiro, 'Escolher atalho.txt')}
      ${opcao('colar-atalho', ic.colar, 'Colar o que o atalho copiou')}
      <label class="linha opcao">${avatarIcone(ic.sino)}<span class="txt">Perguntar ao abrir</span>
        <input type="checkbox" class="interruptor" data-a="perguntar-atalho" ${lerPref('perguntarAtalho', '1') === '1' ? 'checked' : ''}></label>
      ${opcao('copiar-nomes', ic.dividas, 'Copiar lista de pessoas', `${np} ${np === 1 ? 'pessoa' : 'pessoas'} · para o 1.º Texto do atalho`, 'dividas')}
      <details><summary class="linha opcao">${avatarIcone(ic.portatil)}<span class="txt">Reinstalar o atalho no Mac</span><span class="chev">${ic.voltar}</span></summary>
        <p class="texto">Cola no Terminal do Mac e toca em Adicionar atalho.</p>
        <div class="botoes-linha"><button class="btn-sec" data-a="copiar-comando">Copiar comando</button></div></details></section>
    <p class="rodape centro">Os dados ficam só neste iPhone.</p>`;
}

/**
 * Abre o ficheiro do atalho (iCloud Drive → Atalhos → Dinheiro → atalho.txt) e junta os movimentos que faltam,
 * cada um com a sua data. Não depende do que está copiado. Só aceita texto, para o iPhone abrir logo os Ficheiros.
 */
function ficheiroAtalho() {
  escolherFicheiro('.txt,text/plain', async f => {
    const t = await lerFicheiro(f);
    if (t.trim().startsWith('{')) importar(t); else importarAtalho(t, 'ficheiro', f.name);
  });
}
/** O ficheiro escolhido não tem movimentos do atalho: mostra o que tem (e deixa copiá-lo), para se perceber porquê. */
function ficheiroEstranho(texto, nome, deNovo = ficheiroAtalho) {
  const linhas = String(texto).split(/\r\n?|\n/).filter(l => l.trim());
  const amostra = linhas.slice(0, 6).map(l => l.length > 90 ? l.slice(0, 89) + '…' : l).join('\n');
  const deRepor = deNovo === repor, outro = !deRepor && nome && !/^atalho( ?\(?\d+\)?)?\.txt$/i.test(nome);
  abrir({
    tipo: 'folha', ok: 'Escolher outro ficheiro',
    titulo: !linhas.length ? (!deRepor && /\n/.test(texto) ? 'O atalho escreveu linhas em branco' : 'O ficheiro está vazio') : deRepor ? 'Este ficheiro não é uma cópia da app' : 'Este ficheiro não tem movimentos do atalho',
    corpo: `<p class="texto" style="padding:0 2px 14px">${deRepor
      ? 'As cópias de segurança chamam-se <b>dinheiro-…json</b> (Definições → Guardar cópia de segurança). Também se pode escolher aqui o <b>atalho.txt</b>.' + (linhas.length ? ' Este ficheiro começa assim:' : '')
      : (outro ? `Escolheste <b>${esc(nome)}</b>. O do atalho chama-se <b>atalho.txt</b> e está em iCloud Drive → Atalhos → Dinheiro. ` : '') + (linhas.length
      ? 'Cada linha do atalho começa pela data, assim: <code>2026-10-09T15:58:12;gasto;Revolut;2;café</code>. Este ficheiro começa assim:'
      : /\n/.test(texto)
      ? 'O atalho escreveu linhas em branco: é a versão antiga, que não guardava o texto. Instala outra vez o atalho pelo Mac (Definições → Reinstalar o atalho no Mac) e regista de novo os movimentos que faltam.'
      : 'Corre o atalho uma vez (Dívida ou Gasto) e volta a escolher <b>atalho.txt</b>.')}</p>
      ${linhas.length ? `<section class="cartao"><p class="texto"><code style="white-space:pre-wrap;display:block">${esc(amostra)}</code></p>
        <div class="botoes-linha"><button class="btn-sec" data-a="copiar-amostra">Copiar o que tem</button></div></section>` : ''}`,
    amostra: String(texto).slice(0, 4000),
    guardar: () => { fechar(); deNovo(); return false; },
  });
}
/** O atalho também copia todos os movimentos que guardou; aqui entram só os que a app ainda não tem. */
function colarAtalho() {
  if (!navigator.clipboard?.readText) { colar(); return; }
  navigator.clipboard.readText().then(t => {
    if (!t.trim()) { toast('Não há nada copiado. Corre o atalho e volta a tocar em Colar.'); return; }
    if (t.trim().startsWith('{')) importar(t); else importarAtalho(t, 'colado');
  }, () => colar()); // sem autorização para ler: abre a folha para colar à mão
}

// Ao abrir a app (ou ao voltar a ela depois de um minuto), pergunta se há movimentos do atalho para juntar.
// Os Ficheiros só abrem depois de um toque, por isso é uma pergunta com o botão "Escolher atalho.txt".
let escondidaDesde = 0;
function perguntarAtalho() {
  const vazio = !db.contas.length && db.grupos.every(g => !g.fichas.length);
  if (camada || vazio || lerPref('perguntarAtalho', '1') !== '1') return;
  acoes('Juntar os movimentos do atalho?', [
    { texto: 'Escolher atalho.txt', fn: ficheiroAtalho },
    { texto: 'Colar o que o atalho copiou', fn: colarAtalho },
  ]);
  camada.pergunta = true; // a atualização automática pode recarregar por cima desta pergunta (volta a aparecer)
  $('.cancelar-acoes').textContent = 'Agora não';
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') escondidaDesde = Date.now();
  else if (escondidaDesde && Date.now() - escondidaDesde > 60000) perguntarAtalho();
});

/** Aviso curto em baixo. Com "desfazer" (uma função), fica mais tempo e tem o botão Desfazer. */
function toast(t, desfazer) {
  const el = $('#toast');
  el.innerHTML = esc(t) + (desfazer ? '<button data-a="desfazer">Desfazer</button>' : '');
  el.classList.toggle('com-acao', !!desfazer);
  el.classList.add('on');
  toast.desfazer = desfazer;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { el.classList.remove('on', 'com-acao'); toast.desfazer = null; }, desfazer ? 5000 : 1800);
}

/* ---------- ações ---------- */
function irPara(tab) {
  gravarPref('tab', tab);
  ui.tab = tab; ui.ordenar = false;
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const a = b.dataset.a, id = b.dataset.id;
  const naFicha = () => acharFicha(ui.ficha[ui.tab]);

  switch (a) {
    case 'tab':
      if (id === ui.tab && ui.ficha[id]) { ui.ficha[id] = null; ui.anim = 'volta'; }
      else if (id === ui.tab) { scrollTo({ top: 0, behavior: 'smooth' }); return; }
      else irPara(id);
      render(); scrollTo(0, 0); return;
    case 'ver-todas': irPara(id); ui.ficha[id] = null; render(); scrollTo(0, 0); return;
    case 'voltar':
      ui.ficha[ui.tab] = null; ui.anim = 'volta';
      render(); scrollTo(0, ui.scroll[ui.tab] || 0); return;
    case 'abrir': // abre uma conta, pessoa ou item, mesmo que esteja noutro separador
      if (b.dataset.tipo !== ui.tab) irPara(b.dataset.tipo); else ui.scroll[ui.tab] = scrollY;
      ui.ficha[ui.tab] = id; ui.anim = 'entra';
      render(); scrollTo(0, 0); return;
    case 'ordenar': ui.ordenar = !ui.ordenar; render(); return;
    case 'mover-conta': mover(db.contas, id, +b.dataset.d); break;
    case 'mover-ficha': { const g = db.grupos.find(g => g.fichas.some(f => f.id === id)); if (g) mover(g.fichas, id, +b.dataset.d); break; }

    case 'nova-conta': folhaConta(null); return;
    case 'editar-conta': folhaConta(ui.ficha.contas); return;
    case 'menu-contas':
      acoes('Contas', [{ texto: 'Nova conta', fn: () => folhaConta(null) }, ...(db.contas.length > 1 ? [{ texto: 'Ordenar', fn: () => { ui.ordenar = true; } }] : [])]);
      return;
    case 'novo-hist': folhaHist(null); return;
    case 'hist': folhaHist(+id); return;
    case 'apagar-hist': {
      const c = db.contas.find(c => c.id === ui.ficha.contas), desfaz = pontoDeRetorno();
      desligarData(c, c.hist[+id].data);
      c.hist.splice(+id, 1); ordenarHist(c);
      guardar(); fechar(); render(); toast('Registo apagado', desfaz); return;
    }
    case 'apagar-conta': {
      const c = db.contas.find(c => c.id === id);
      confirmar(`Apagar a conta "${c.nome}"?`, 'Apagar', () => { db.contas = db.contas.filter(x => x !== c); });
      return;
    }

    case 'novo-grupo':
      pedirNome('Novo grupo', '', n => db.grupos.push({ id: uid(), nome: n, tipo: ui.tab, fichas: [] }));
      return;
    case 'nova-ficha': novaFicha(db.grupos.find(g => g.id === id)); return;
    case 'menu-tab': {
      const div = ui.tab === 'dividas';
      acoes(div ? 'Dívidas' : 'Gastos', [
        { texto: div ? 'Nova pessoa' : 'Novo item', fn: escolherGrupoNova },
        { texto: 'Novo grupo', fn: () => pedirNome('Novo grupo', '', n => db.grupos.push({ id: uid(), nome: n, tipo: ui.tab, fichas: [] })) },
        ...(gruposDe(ui.tab).length > 1 || gruposDe(ui.tab).some(g => g.fichas.length > 1) ? [{ texto: 'Ordenar', fn: () => { ui.ordenar = true; } }] : []),
      ]);
      return;
    }
    case 'menu-grupo': {
      const g = db.grupos.find(g => g.id === id);
      acoes(g.nome, [
        { texto: g.tipo === 'dividas' ? 'Adicionar pessoa' : 'Adicionar item', fn: () => novaFicha(g) },
        { texto: 'Mudar nome', fn: () => pedirNome('Mudar nome', g.nome, n => { g.nome = n; }) },
        { texto: 'Apagar grupo', perigo: true, fn: () => apagarComContas(`Apagar "${g.nome}" e tudo o que tem dentro?`, g.fichas.flatMap(f => f.movimentos), () => { db.grupos = db.grupos.filter(x => x !== g); }) },
      ]);
      return;
    }
    case 'menu-ficha': {
      const [g, f] = naFicha();
      const botoes = [{ texto: 'Mudar nome', fn: () => pedirNome('Mudar nome', f.nome, n => { f.nome = n; }) }];
      // por exemplo, passar quem chegou pelo atalho a "Do atalho" para Pais ou Amigos
      const outros = gruposDe(g.tipo).filter(x => x !== g);
      if (outros.length) botoes.push({ texto: 'Mudar de grupo', fn: () => acoes(`Passar ${f.nome} para`, outros.map(x => ({
        texto: x.nome, desfazer: `${f.nome} passou para ${x.nome}`, fn: () => { g.fichas = g.fichas.filter(y => y !== f); x.fichas.push(f); },
      }))) });
      if (f.movimentos.length) botoes.push({ texto: 'Apagar todos os movimentos', perigo: true,
        fn: () => apagarComContas(`Apagar todos os movimentos de ${f.nome}?`, f.movimentos, () => { f.movimentos = []; }) });
      botoes.push({ texto: g.tipo === 'dividas' ? 'Apagar pessoa' : 'Apagar item', perigo: true,
        fn: () => apagarComContas(`Apagar ${f.nome} e os seus movimentos?`, f.movimentos, () => { g.fichas = g.fichas.filter(x => x !== f); ui.ficha[ui.tab] = null; }) });
      acoes(f.nome, botoes);
      return;
    }

    case 'novo-mov': folhaMov(null); return;
    case 'mov': folhaMov(id); return;
    case 'apagar-mov': {
      const [, f] = naFicha(), m = f.movimentos.find(m => m.id === id), l = m?.descontado && contaLigada(m);
      const apagar = devolver => () => { if (devolver) ajustarDesconto(m, null); f.movimentos = f.movimentos.filter(x => x !== m); };
      if (l) {
        const d = m.descontado;
        acoes(`Este gasto veio do atalho e foi descontado em ${l.c.nome}`, [
          { texto: d < 0 ? `Apagar e tirar ${euro(-d)} a ${l.c.nome}` : `Apagar e devolver ${euro(d)} a ${l.c.nome}`, fn: apagar(true), desfazer: 'Movimento apagado' },
          { texto: `Apagar só aqui (${l.c.nome} fica igual)`, fn: apagar(false), desfazer: 'Movimento apagado' },
        ]);
        return;
      }
      const desfaz = pontoDeRetorno();
      apagar(false)();
      guardar(); fechar(); render(); toast('Movimento apagado', desfaz); return;
    }
    case 'sinal':
      camada.sinal = id === '1';
      document.querySelectorAll('#f-sinal button').forEach(x => x.classList.toggle('on', x.dataset.id === id));
      ajudaSinal(); return;
    case 'saldar': {
      const [, f] = naFicha(), t = totalFicha(f), desfaz = pontoDeRetorno();
      f.movimentos.push({ id: uid(), valor: -t, desc: t > 0 ? 'pagou' : 'paguei', data: hoje() });
      toast('Conta saldada', desfaz);
      break;
    }

    case 'fechar': fechar(); return;
    case 'guardar-folha': if (camada?.guardar() === true) { guardar(); fechar(); render(); } return;
    case 'acao': {
      const botao = camada.botoes[+id], desfaz = botao.desfazer && pontoDeRetorno();
      camada = null; $('#camada').innerHTML = ''; document.documentElement.classList.remove('travado');
      botao.fn(); guardar(); render();
      if (desfaz) toast(botao.desfazer, desfaz);
      return;
    }
    case 'desfazer': {
      if (!toast.desfazer) return;
      const aviso = toast.desfazer();
      toast(typeof aviso === 'string' ? aviso : 'Desfeito');
      break;
    }

    case 'periodo': ui.periodo = id; gravarPref('periodo', id); render(); return;
    case 'ocultar':
      ui.oculto = !ui.oculto; gravarPref('oculto', ui.oculto ? '1' : '');
      document.documentElement.classList.toggle('oculto', ui.oculto);
      render(); return;

    case 'rapido': { // botões redondos do início: escolher a conta, pessoa ou item e abrir logo a folha
      const ir = (tipo, fid, folha) => () => { irPara(tipo); ui.ficha[tipo] = fid; render(); scrollTo(0, 0); folha(null); };
      if (id === 'contas') {
        if (!db.contas.length) { irPara('contas'); render(); folhaConta(null); return; }
        abrir({ tipo: 'acoes', grelha: true, titulo: 'Atualizar o valor de', botoes: db.contas.map(c => ({ texto: c.nome, slot: slotConta(c), fn: ir('contas', c.id, folhaHist) })) });
        return;
      }
      const fichas = gruposDe(id).flatMap(g => g.fichas);
      if (!fichas.length) { irPara(id); render(); scrollTo(0, 0); toast(id === 'dividas' ? 'Adiciona primeiro uma pessoa' : 'Adiciona primeiro um item'); return; }
      abrir({ tipo: 'acoes', grelha: true, titulo: id === 'dividas' ? 'Movimento de' : 'Gasto em', botoes: fichas.map(f => ({ texto: f.nome, fn: ir(id, f.id, folhaMov) })) });
      return;
    }
    case 'mais': case 'menu-copias': irPara('definicoes'); render(); scrollTo(0, 0); return;
    case 'tema': gravarPref('tema', id); aplicarTema(); render(); return;
    case 'slide': { const sl = $('.heroi-slides'); sl?.scrollTo({ left: sl.clientWidth * +id, behavior: 'smooth' }); return; }
    case 'perguntar-atalho':
      gravarPref('perguntarAtalho', b.checked ? '1' : '');
      toast(b.checked ? 'Vai perguntar ao abrir' : 'Já não pergunta ao abrir');
      return;
    case 'exportar': exportar(); return;
    case 'backup': backup(); return;
    case 'repor': repor(); return;
    case 'colar-atalho': colarAtalho(); return;
    case 'ficheiro-atalho': ficheiroAtalho(); return;
    case 'copiar-amostra':
      navigator.clipboard.writeText(camada?.amostra || '').then(() => toast('Copiado'), () => toast('Não foi possível copiar'));
      return;
    case 'copiar-comando':
      navigator.clipboard.writeText(COMANDO_MAC).then(() => toast('Comando copiado'), () => toast('Não foi possível copiar'));
      return;
    case 'copiar-nomes': {
      const n = nomesAtalho(id);
      if (!n.length) { toast(id === 'contas' ? 'Ainda não há contas' : 'Ainda não há pessoas'); return; }
      navigator.clipboard.writeText(n.join('\n'))
        .then(() => toast(id === 'contas' ? 'Contas copiadas' : 'Pessoas copiadas'), () => toast('Não foi possível copiar'));
      return;
    }
    case 'colar': colar(); return;
    default: return;
  }
  guardar(); render();
});

// Os botões do seletor +/− não tiram o foco ao campo do valor (o teclado não fecha).
document.addEventListener('mousedown', e => { if (e.target.closest('.seg')) e.preventDefault(); });

document.addEventListener('input', e => {
  if (e.target.dataset.campo !== 'nota') return;
  alturaNota(e.target);
  const [, f] = acharFicha(ui.ficha[ui.tab]);
  if (f) { f.nota = e.target.value; guardar(); }
});

document.addEventListener('keydown', e => {
  const graf = e.target.closest?.('.graf');
  if (graf && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); passoGraf(graf, e.key === 'ArrowRight' ? 1 : -1); return; }
  if (!camada) return;
  if (e.key === 'Escape') fechar();
  if (e.key === 'Enter' && camada.guardar && e.target.matches('#camada input')) {
    e.preventDefault(); $('[data-a="guardar-folha"]').click();
  }
});

// Gráficos: arrastar o dedo (ou passar o rato) mostra o valor em cada data.
const grafEm = e => e.target.closest?.('.graf');
const mostrarEm = (el, e) => mostrar(el, e.clientX - el.getBoundingClientRect().left);
document.addEventListener('pointerdown', e => { const el = grafEm(e); if (el) mostrarEm(el, e); });
document.addEventListener('pointermove', e => { const el = grafEm(e); if (el) mostrarEm(el, e); });
document.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') document.querySelectorAll('.graf.ativo').forEach(esconder); });
document.addEventListener('pointercancel', () => document.querySelectorAll('.graf.ativo').forEach(esconder));
document.addEventListener('pointerout', e => { const el = grafEm(e); if (el && e.pointerType === 'mouse' && !el.contains(e.relatedTarget)) esconder(el); });
document.addEventListener('focusout', e => { if (e.target.matches?.('.graf')) esconder(e.target); });

// Topo do Início: ao deslizar entre os dois totais, os pontos mostram qual está à vista.
document.addEventListener('scroll', e => {
  const sl = e.target;
  if (!sl.classList?.contains('heroi-slides')) return;
  ui.slide = Math.round(sl.scrollLeft / sl.clientWidth);
  document.querySelectorAll('.pontos button').forEach((b, i) => b.classList.toggle('on', i === ui.slide));
}, true);

// Ao rodar o iPhone (ou mudar a largura da janela), os gráficos são redesenhados com a nova largura.
let larguraAntes = innerWidth;
addEventListener('resize', () => { if (innerWidth !== larguraAntes) { larguraAntes = innerWidth; render(); } });

// O atalho abre https://…/dinheiro/#atalho=<linha>: o movimento entra logo e o link é limpo (recarregar não o repete).
function lerLinkAtalho() {
  const m = location.hash.match(/^#atalho=([\s\S]+)$/);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  let texto = m[1];
  try { texto = decodeURIComponent(texto.replace(/\+/g, ' ')); } catch {}
  importarAtalho(texto, 'link');
}
addEventListener('hashchange', lerLinkAtalho);

document.documentElement.classList.toggle('oculto', ui.oculto);
aplicarTema();
render();
if (!location.hash.startsWith('#atalho=')) setTimeout(perguntarAtalho, 400); // com um link, o movimento que entra fica à vista
lerLinkAtalho();
navigator.storage?.persist?.();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});

// O iPhone deixa a app aberta em segundo plano e, ao voltar, mostra a página antiga sem a recarregar.
// Por isso, quando a app volta ao ecrã, compara a página no servidor com a que tinha ao abrir e recarrega se mudou
// (não recarrega com uma folha aberta, para não perder o que se está a escrever; a pergunta do atalho não conta).
const assinatura = t => { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return h; };
const paginaNoServidor = () => fetch('index.html', { cache: 'no-store' }).then(r => r.ok ? r.text() : null).then(t => t && assinatura(t)).catch(() => null);
let versaoAberta = null, toques = 0;
paginaNoServidor().then(v => { versaoAberta = v; });
document.addEventListener('click', () => { toques++; }, true);
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || versaoAberta === null) return;
  const antes = toques;
  const v = await paginaNoServidor();
  // se entretanto se tocou em algo (ex.: "Escolher atalho.txt" já abriu os Ficheiros), fica para a próxima vez
  if (v !== null && v !== versaoAberta && toques === antes && Date.now() > escolhaAte && (!camada || camada.pergunta)) location.reload();
});
</script>
